<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>嘰哩 · Zita 生日快樂</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/zpix/dist/zpix.css">
<style>
  :root { --vw: 1200px; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: "zpix", "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", monospace; color: #5c4033; background: #6fbf4f;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
  canvas { image-rendering: pixelated; }
  #bg, #fx { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #bg { z-index: 4; }
  #fx { z-index: 5000; pointer-events: none; }

  /* ---------- 太陽 + 光線 ---------- */
  :root { --sw: clamp(62px, 15vw, 104px); }
  #sky, #stars, #tint { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #sky { z-index: 0; } #stars { z-index: 1; }
  #sunpos, #moonpos { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; pointer-events: none; will-change: transform; display: none; }
  #sunwrap { position: absolute; left: calc(var(--sw) / -2); top: calc(var(--sw) / -2); width: var(--sw); aspect-ratio: 1 / 1;
    pointer-events: none; animation: sunbob 6s ease-in-out infinite; }
  #moonwrap { position: absolute; left: calc(var(--sw) * -0.4); top: calc(var(--sw) * -0.4); width: calc(var(--sw) * 0.8); aspect-ratio: 1 / 1;
    pointer-events: none; animation: sunbob 7s ease-in-out infinite; }
  #moonwrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 480%; height: 480%; border-radius: 50%;
    transform: translate(-50%, -50%); animation: glow 6s ease-in-out infinite;
    background: radial-gradient(circle, rgba(214,226,255,.6) 0, rgba(190,205,255,.22) 34%, rgba(190,205,255,0) 66%); }
  #moonwrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .zz { position: absolute; left: 70%; top: 6%; font-weight: bold; font-size: 13px; color: #eef2ff; text-shadow: 1px 1px 0 #5a67b0;
    opacity: 0; animation: zup 4s ease-out infinite; animation-delay: var(--d); }
  @keyframes zup { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(20px,-36px) scale(1.3); opacity: 0; } }
  #clouds { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; overflow: hidden; }
  @keyframes sunbob { 50% { transform: translateY(5px); } }
  #sunwrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 520%; height: 520%; border-radius: 50%;
    transform: translate(-50%, -50%); animation: glow 5s ease-in-out infinite;
    background: radial-gradient(circle, rgba(255,244,170,.75) 0, rgba(255,244,170,.26) 36%, rgba(255,244,170,0) 68%); }
  @keyframes glow { 50% { transform: translate(-50%, -50%) scale(1.1); opacity: .8; } }
  #rays { position: absolute; left: 50%; top: 50%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; opacity: .55;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,226,.22) 0 5deg, rgba(255,255,226,0) 5deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, rgba(0,0,0,.5) 18%, transparent 46%);
            mask-image: radial-gradient(circle, #000 0, rgba(0,0,0,.5) 18%, transparent 46%);
    animation: spin 160s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sunwrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #rayA { animation: rayA 1.2s steps(1) infinite; }
  #rayB { animation: rayB 1.2s steps(1) infinite; }
  @keyframes rayA { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes rayB { 0% { opacity: 0; } 50% { opacity: 1; } }

  /* ---------- 雲 ---------- */
  .cloud { position: absolute; left: 0; top: 0; will-change: transform; opacity: .97;
    animation: drift var(--dur, 100s) linear infinite; animation-delay: var(--dl, 0s); }
  .cloud canvas { display: block; width: 100%; height: 100%; }
  @keyframes drift { from { transform: translate3d(-120%, 0, 0); } to { transform: translate3d(calc(var(--vw) + 20%), 0, 0); } }

  /* ---------- Y2K 氣球隊 ---------- */
  #parade { position: absolute; left: 0; top: 1.5vh; width: 520px; height: 260px; z-index: 50;
    transform-origin: 0 0; pointer-events: none; will-change: transform;
    animation: fly 30s linear 3s infinite backwards; }
  @keyframes fly {
    0%   { transform: translateX(var(--from)) scale(var(--ps)); }
    55%  { transform: translateX(var(--to)) scale(var(--ps)); }
    100% { transform: translateX(var(--to)) scale(var(--ps)); }
  }
  #parade .bob { position: absolute; top: 0; left: 0; right: 0; bottom: 0; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-9px); } }
  .bw { position: absolute; transform-origin: 50% 100%; animation: sway 2.6s ease-in-out infinite; animation-delay: var(--d); }
  .bw canvas { display: block; image-rendering: pixelated; }
  @keyframes sway { 0%,100% { transform: rotate(calc(var(--a) - 4deg)); } 50% { transform: rotate(calc(var(--a) + 4deg)); } }
  #banner { position: absolute; left: 50px; top: 211px; width: 420px; box-sizing: border-box;
    padding: 8px 6px 7px; text-align: center; white-space: nowrap;
    font-size: 27px; font-weight: bold; line-height: 1.1;
    background: repeating-linear-gradient(90deg, #fff4fa 0 14px, #ffd3ea 14px 28px);
    border: 4px solid #7a3b8f; box-shadow: 4px 4px 0 #b78ad0, inset 0 0 0 3px #fff;
    clip-path: polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
    transform-origin: 50% 0; animation: flap 2.4s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
  #banner span { display: inline-block; text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(90,40,110,.35);
    animation: hop2 1.1s ease-in-out infinite; animation-delay: var(--t); }
  @keyframes hop2 { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-7px) rotate(-6deg); } }
  .sp { position: absolute; width: 14px; height: 14px; background: #fff; z-index: 1;
    clip-path: polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
    animation: tw 1.2s ease-in-out infinite; animation-delay: var(--t); }
  @keyframes tw { 0%,100% { transform: scale(.2) rotate(0); opacity: .3; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }

  /* ---------- 場景物件 ---------- */
  .prop { position: absolute; pointer-events: none; }
  .prop canvas { display: block; width: 100%; height: 100%; }
  .flame { position: absolute; width: 10%; height: 15%; transform: translate(-50%, -100%); transition: opacity .2s;
    clip-path: polygon(50% 0, 100% 62%, 82% 100%, 18% 100%, 0 62%);
    background: linear-gradient(#fff6b0, #ffb21f 55%, #ff6a1f);
    animation: flick .42s ease-in-out infinite alternate; }
  .flame.out { opacity: 0; }
  @keyframes flick { from { transform: translate(-50%, -100%) scale(1, 1); } to { transform: translate(-50%, -100%) scale(.8, 1.2); } }
  .smoke { position: absolute; width: 7%; height: 7%; border-radius: 50%; background: rgba(238,238,248,.9); pointer-events: none; }

  /* ---------- 貓咪 ---------- */
  #cat { position: absolute; left: 0; top: 0; width: var(--size, 150px); height: var(--size, 150px);
    transform-origin: 50% 100%; will-change: transform; transition: opacity .6s; }
  #shadow { position: absolute; left: 14%; right: 14%; bottom: -3%; height: 11%; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(30,70,20,.45) 0, rgba(30,70,20,.25) 55%, rgba(30,70,20,0) 74%); }
  #sprite { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 100%; }
  #catBody { width: 100%; height: 100%; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.018, .982); } }
  #img { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;
    border: none; background: transparent; -webkit-user-drag: none; cursor: pointer; transition: transform .16s ease-out; }

  /* 對話框（獨立一層，唔會俾前景遮住） */
  #bubble { position: absolute; left: 0; top: 0; z-index: 4000; display: none; pointer-events: none;
    width: max-content; max-width: min(72vw, 280px); will-change: transform; }
  #bi { position: relative; transform-origin: 50% 100%; box-sizing: border-box;
    font-size: 14px; font-weight: bold; line-height: 1.45; text-align: center;
    background: rgba(255,253,245,.97); border: 2px solid #5c4033; box-shadow: 2px 2px 0 #c89666; padding: 4px 12px; }
  #bi::after { content: ""; position: absolute; left: calc(50% + var(--tail, 0px)); bottom: -7px; width: 8px; height: 8px; margin-left: -4px;
    background: rgba(255,253,245,.97); border-right: 2px solid #5c4033; border-bottom: 2px solid #5c4033; transform: rotate(45deg); }

  /* ---------- 流星許願卡（專屬對話框） ---------- */
  #wish { position: absolute; left: 0; top: 0; z-index: 4100; display: none; pointer-events: none;
    width: max-content; max-width: min(80vw, 300px); will-change: transform; }
  #wi { position: relative; box-sizing: border-box; text-align: center; color: #fff6dc; overflow: visible;
    transform-origin: 50% 100%; padding: 7px 18px 12px; --edge: #ffe3a1; --glow: 255,217,138; --hold: 6500ms;
    background:
      radial-gradient(1px 1px at 12% 28%, #fff 99%, transparent), radial-gradient(1px 1px at 84% 22%, #fff 99%, transparent),
      radial-gradient(1px 1px at 68% 78%, #ffe9b0 99%, transparent), radial-gradient(1px 1px at 26% 82%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 92% 64%, #ffd9e8 99%, transparent), radial-gradient(1.5px 1.5px at 6% 60%, #cfe0ff 99%, transparent),
      linear-gradient(160deg, #262a66 0%, #44357a 55%, #74457f 100%);
    border: 2px solid var(--edge); outline: 2px solid #2a1f45; outline-offset: 0;
    box-shadow: 0 0 0 4px rgba(var(--glow), .18), 0 0 22px rgba(var(--glow), .55), 3px 4px 0 rgba(20,10,40,.45); }
  #wi::after { content: ""; position: absolute; left: calc(50% + var(--tail, 0px)); bottom: -8px; width: 10px; height: 10px; margin-left: -5px;
    background: #6a4480; border-right: 2px solid var(--edge); border-bottom: 2px solid var(--edge); transform: rotate(45deg); }
  #wi .wt { font-size: 11px; letter-spacing: 3px; color: var(--edge); margin-bottom: 2px; text-shadow: 0 0 6px rgba(var(--glow), .8); }
  #wi .wx { font-size: 14px; font-weight: bold; line-height: 1.65; text-shadow: 0 1px 0 rgba(20,10,40,.6); }
  #wi .wbar { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
  #wi .wbar::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(var(--glow), .2), rgb(var(--glow)));
    transform-origin: 0 50%; animation: wbar var(--hold) linear forwards; }
  @keyframes wbar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  #wi .sp { position: absolute; font-style: normal; font-size: 12px; line-height: 1; color: var(--edge); text-shadow: 0 0 8px rgba(var(--glow), .95);
    animation: wtw 1.8s ease-in-out infinite; }
  #wi .sp.a { left: -8px; top: -9px; } #wi .sp.b { right: -9px; top: -5px; font-size: 10px; animation-delay: -.6s; }
  #wi .sp.c { left: -6px; bottom: 6px; font-size: 9px; animation-delay: -1.1s; } #wi .sp.d { right: -8px; bottom: 4px; animation-delay: -.3s; }
  @keyframes wtw { 0%,100% { transform: scale(.55) rotate(0); opacity: .45; } 50% { transform: scale(1.25) rotate(45deg); opacity: 1; } }
  #wi::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%); background-size: 250% 100%; }
  #wi.in::before { animation: wsheen 1.3s .25s ease-out 1; }
  @keyframes wsheen { 0% { opacity: 1; background-position: 120% 0; } 100% { opacity: 1; background-position: -120% 0; } }
  #wi.gold { --edge: #ffd75a; --glow: 255,200,70;
    background:
      radial-gradient(1.5px 1.5px at 14% 30%, #fff6b0 99%, transparent), radial-gradient(1.5px 1.5px at 86% 26%, #fff 99%, transparent),
      radial-gradient(1px 1px at 70% 80%, #fff6b0 99%, transparent), radial-gradient(1px 1px at 24% 78%, #fff 99%, transparent),
      linear-gradient(160deg, #3a2468 0%, #7a3f7e 55%, #c06a45 100%);
    box-shadow: 0 0 0 4px rgba(var(--glow), .25), 0 0 30px rgba(var(--glow), .75), 3px 4px 0 rgba(20,10,40,.45); animation: wpulse 1.6s ease-in-out infinite; }
  #wi.gold::after { background: #b4654a; }
  #wi.gold .sp { font-size: 14px; }
  @keyframes wpulse { 50% { box-shadow: 0 0 0 5px rgba(var(--glow), .35), 0 0 40px rgba(var(--glow), .95), 3px 4px 0 rgba(20,10,40,.45); } }
  #wi.sleep { --edge: #b9c8f0; --glow: 150,175,235; color: #dfe8ff;
    background: linear-gradient(160deg, #1d2552 0%, #2f3b72 100%); }
  #wi.sleep::after { background: #2b366a; }
  #wi.sleep .wx { font-weight: normal; opacity: .9; }
  @media (prefers-reduced-motion: reduce) { #wi .sp, #wi.gold, #wi.in::before { animation: none; } }

  /* ---------- 色調層、路燈光暈、時鐘 ---------- */
  #tint { z-index: 3000; mix-blend-mode: multiply; }
  .glow { position: absolute; z-index: 3100; pointer-events: none; mix-blend-mode: screen; border-radius: 50%;
    opacity: var(--lamp, 0); transition: opacity .15s linear; will-change: opacity, transform; }
  .glow.lamp { background: radial-gradient(circle, rgba(255,251,222,1) 0, rgba(255,236,160,.92) 5%, rgba(255,205,110,.5) 17%, rgba(255,175,80,.2) 42%, rgba(255,160,70,0) 70%);
    animation: lampb 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes lampb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .glow.pool { background: radial-gradient(ellipse at center, rgba(255,196,110,.55) 0, rgba(255,180,90,.24) 45%, rgba(255,170,80,0) 72%); }
  .glow.cake { background: radial-gradient(circle, rgba(255,226,150,.85) 0, rgba(255,190,100,.35) 30%, rgba(255,170,80,0) 68%);
    opacity: calc(var(--lamp, 0) * var(--on, 1)); transition: opacity .6s; }
  #clock { position: fixed; right: calc(8px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); z-index: 6000;
    font-family: "zpix", "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", monospace; font-size: 13px; font-weight: bold; color: #5c4033;
    background: rgba(255,253,245,.92); border: 2px solid #5c4033; box-shadow: 2px 2px 0 #c89666; padding: 3px 10px; white-space: nowrap;
    cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #clock:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #c89666; }
  #hint { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6000;
    font-size: 12px; font-weight: bold; white-space: nowrap; pointer-events: none;
    background: rgba(255,253,245,.9); border: 2px solid #5c4033; box-shadow: 2px 2px 0 #c89666; padding: 3px 12px;
    animation: hintOut 1s ease 8s forwards; }
  @keyframes hintOut { to { opacity: 0; visibility: hidden; } }
  /* ---------- 吹蠟燭・驚喜特效 ---------- */
  #dim { position: fixed; inset: 0; z-index: 3200; pointer-events: none; opacity: 0; transition: opacity .12s ease-out;
    background: radial-gradient(ellipse at 50% 28%, rgba(20,16,70,.8), rgba(2,2,14,.96) 75%); }
  #dim.on { opacity: 1; }
  #dim.off { transition: opacity 1.6s ease-in; opacity: 0; }
  #cele, #gold { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: auto; }
  #cele { z-index: 3300; } #gold { z-index: 5500; }
  #cakeHint { position: fixed; z-index: 4050; display: none; pointer-events: none; transform: translate(-50%, -100%);
    font-size: 12px; font-weight: bold; white-space: nowrap; color: #5c4033; background: rgba(255,253,245,.97);
    border: 2px solid #5c4033; box-shadow: 2px 2px 0 #c89666, 0 0 14px rgba(255,215,90,.8); padding: 3px 10px;
    animation: hintbob 1s ease-in-out infinite; }
  @keyframes hintbob { 50% { transform: translate(-50%, calc(-100% - 5px)); } }
  .prop.ready { animation: cakeglow 1.1s ease-in-out infinite; }
  @keyframes cakeglow { 50% { filter: drop-shadow(0 0 7px #ffd75a) brightness(1.14); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky"></canvas>
  <canvas id="stars"></canvas>
  <div id="sunpos"><div id="sunwrap"><div id="rays"></div></div></div>
  <div id="moonpos"><div id="moonwrap"><span class="zz" style="--d:0s">z</span><span class="zz" style="--d:1.3s">Z</span><span class="zz" style="--d:2.6s">z</span></div></div>
  <div id="clouds"></div>
  <canvas id="bg"></canvas>
  <div id="cat">
    <div id="shadow"></div>
    <div id="sprite"><div id="catBody"><img id="img" alt="貓咪"></div></div>
  </div>
  <div id="bubble"><div id="bi"></div></div>
  <div id="wish"><div id="wi"><i class="sp a">✦</i><i class="sp b">✦</i><i class="sp c">✦</i><i class="sp d">✦</i><div class="wt"></div><div class="wx"></div><div class="wbar"></div></div></div>
  <canvas id="tint"></canvas>
  <canvas id="fx"></canvas>
  <div id="dim"></div><canvas id="cele"></canvas><canvas id="gold"></canvas><div id="cakeHint"></div>
</div>
<button id="clock" type="button">🌤️ 清晨</button>
<div id="hint">點一點貓咪或畫面 ✨　右上角可快轉時間 ⏩</div>

<script>
  if (/debug/.test(location.search)) {
  window.onerror = function (m, u, l) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;background:#fff;color:#c00;font:12px monospace;padding:4px;max-width:100%'; d.textContent = 'Error: ' + m + ' (line ' + l + ')'; document.body.appendChild(d); };
}

/* ========== 設定 ========== */
const BASE = "https://smallsmallpotato.github.io/curiosity/images/cats/";
const IMG = {
  normal: "嘰哩", curious: "嘰哩好奇", happy: "嘰哩開心", angry: "嘰哩生氣",
  sleep: "嘰哩睡覺", lying: "嘰哩躺下", waiting: "嘰哩等待", scorn: "嘰哩鄙視",
  meow: "嘰哩喵喵", wash: "嘰哩洗澡", coax: "嘰哩撒嬌", stand: "嘰哩站起",
  wave: "嘰哩揮手", rich: "嘰哩招財", stretch1: "嘰哩拉筋1", stretch2: "嘰哩拉筋2",
  poop: "嘰哩大便", water: "嘰哩喝水", fear: "嘰哩怕怕", play: "嘰哩玩耍"
};
const src = k => BASE + encodeURIComponent(IMG[k]) + ".PNG";
Object.keys(IMG).forEach(k => { const i = new Image(); i.src = src(k); });   // 預載，換姿勢唔會閃

// 如果發現貓咪行路方向反咗，將呢個改成 false
const FACES_LEFT_BY_DEFAULT = true;
const SPEED = 95;   // 行路速度（近景，像素/秒）

/* 離開畫面再返嚟，會見到佢喺度做以下其中一樣 */
const SPECIALS = [
  { img: "sleep", texts: ["「Zzz... 呼嚕嚕...（反肚大睡）」", "「Zzz...」"] },
  { img: "lying", texts: ["「地板涼涼的，躺平最舒服～」", "「……?」"] },
  { img: "poop", texts: ["「嗯……（埋沙子中）」", "「……請不要偷看。」"] },
  { img: "water", texts: ["「咕嚕咕嚕……喝水水！」", "「咕嚕咕嚕……」"] },
  { img: "fear", texts: ["「嗚哇……啱啱係咩聲咁大聲！」", "「怕怕……」"] },
  { img: "play", texts: ["「捉到你！喵哈哈～」", "「嘿！嘿！」"] }
];

/* ========== 基本元件 ========== */
const stage = document.getElementById("stage");
const bg = document.getElementById("bg"), fx = document.getElementById("fx");
const cat = document.getElementById("cat"), sprite = document.getElementById("sprite");
const catBody = document.getElementById("catBody"), img = document.getElementById("img"), shadow = document.getElementById("shadow");
const bubble = document.getElementById("bubble"), bi = document.getElementById("bi");

let gen = 0, pos = { x: 0, y: 0 }, posF = { xf: 0.5, f: 0.92 }, curK = 1, curKey = "", curText = "";

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const size = () => Math.round(Math.min(150, Math.max(100, innerWidth * 0.3)));
const frame = () => new Promise(r => requestAnimationFrame(r));
function applySize() { cat.style.setProperty("--size", size() + "px"); }

async function wait(ms, tok) {
  await new Promise(r => setTimeout(r, ms));
  if (tok !== gen) throw "cancel";
}

/* ========== 花園座標系 ========== */
// 腳嘅位置用「畫面高度比例 f」表示，f 越大越近
const FMIN = 0.46, FMAX = 0.95, BAND0 = 0.84, BAND1 = 0.96, MIN_SCALE = 0.4;
const pathCx = f => 0.5 + 0.2 * Math.sin((f - 0.4) * 9);
const pathHw = f => 0.04 + 0.1 * Math.max(0, (f - 0.4) / 0.6);
const kOf = f => MIN_SCALE + (1 - MIN_SCALE) * clamp((f - FMIN) / (FMAX - FMIN), 0, 1);
const toTL = (xFrac, f) => ({ x: xFrac * innerWidth - size() / 2, y: f * innerHeight - size() });
const curF = () => (pos.y + size()) / innerHeight;

const CAKE = { xf: 0.78, f: 0.68, mult: 0.8 };
const GIFT = { xf: 0.2, f: 0.72, mult: 1.05 };
const inZone = (xf, f) =>
  (Math.abs(xf - CAKE.xf) < 0.17 && Math.abs(f - CAKE.f) < 0.09) ||
  (Math.abs(xf - GIFT.xf) < 0.14 && Math.abs(f - GIFT.f) < 0.08);

function randPos() {
  const f = rand(0.5, 0.94);
  const xf = f > BAND0 ? rand(0.1, 0.9) : pathCx(f) + rand(-0.6, 0.6) * pathHw(f);
  return Object.assign(toTL(xf, f), { f: f, xf: xf });
}

/* 擺放貓咪：位置 + 遠近縮放 + 前後層次 */
function setCat(x, y) {
  pos.x = x; pos.y = y;
  const S = size(), feet = y + S, k = kOf(feet / innerHeight);
  curK = k; posF.xf = (x + S / 2) / innerWidth; posF.f = feet / innerHeight;
  cat.style.transform = "translate3d(" + x + "px," + y + "px,0) scale(" + k + ")";
  cat.style.zIndex = Math.round(feet);
  layoutBubble();
}

  if (Math.abs(dx) < 1) return;

  bi.textContent = t;

    { transform: "scale(.6)", opacity: 0 }, { transform: "scale(1.06)", opacity: 1, offset: .6 }, { transform: "scale(1)", opacity: 1 }

/* 對話框跟住貓頭，夾喺畫面入面 */

/* ========== 平滑行路：樣條曲線 + 緩起緩停 + 步伐同步 ========== */
function easeTrap(u) {
  const r = 0.16, v = 1 / (1 - r);
  if (u < r) return v * u * u / (2 * r);
  if (u < 1 - r) return v * (r / 2 + (u - r));
  return 1 - v * (1 - u) * (1 - u) / (2 * r);
}
function route(t) {
  const S = size(), f0 = curF(), f1 = (t.y + S) / innerHeight;
  const n = Math.max(1, Math.ceil(Math.abs(f1 - f0) / 0.12)), pts = [];
  for (let i = 1; i < n; i++) {
    const f = f0 + (f1 - f0) * i / n;
    pts.push(toTL(pathCx(f) + rand(-0.4, 0.4) * pathHw(f), f));
  }
  pts.push({ x: t.x, y: t.y });
  return pts;
}
async function followPath(pts, tok) {
  const S = size(), P = [{ x: pos.x, y: pos.y }].concat(pts), smp = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let s = 0; s < 10; s++) {
      const u = s / 10, u2 = u * u, u3 = u2 * u;
      const cr = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
      smp.push({ x: cr(p0.x, p1.x, p2.x, p3.x), y: cr(p0.y, p1.y, p2.y, p3.y) });
    }
  }
  smp.push({ x: P[P.length - 1].x, y: P[P.length - 1].y });
  const cum = [0];
  for (let i = 1; i < smp.length; i++) {
    const d = Math.hypot(smp[i].x - smp[i - 1].x, smp[i].y - smp[i - 1].y);
    const k = kOf((smp[i].y + S) / innerHeight);
    cum.push(cum[i - 1] + d / (0.45 + 0.55 * k));       // 越遠，行得越「慢」
  }
  const L = cum[cum.length - 1];
  if (L < 4) return;
  setImg("stand"); moving = true;
  const dur = L / SPEED * 1000, t0 = performance.now();
  let idx = 0, phase = 0, lx = pos.x, ly = pos.y, lean = 0;
  for (;;) {
    await frame();
    if (tok !== gen) throw "cancel";
    const u = Math.min(1, (performance.now() - t0) / dur), s = easeTrap(u) * L;
    while (idx < cum.length - 2 && cum[idx + 1] < s) idx++;
    const a = smp[idx], b = smp[idx + 1], seg = cum[idx + 1] - cum[idx];
    const w = seg > 0 ? clamp((s - cum[idx]) / seg, 0, 1) : 0;
    const x = a.x + (b.x - a.x) * w, y = a.y + (b.y - a.y) * w;
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) > 0.25 * Math.hypot(dx, dy)) face(dx);
    const k = kOf((y + S) / innerHeight);
    lean += (clamp((x - lx) / (S * k) * 260, -3, 3) - lean) * 0.12;
    phase += Math.hypot(x - lx, y - ly) / (S * k) * Math.PI * 2.4;
    lx = x; ly = y;
    const hop = Math.abs(Math.sin(phase));
    sprite.style.transform = "translateY(" + (-hop * S * 0.045) + "px) rotate(" + (Math.sin(phase) * 2.2 + lean) + "deg) scale("
      + (1 - (hop - 0.5) * 0.05) + "," + (1 + (hop - 0.5) * 0.06) + ")";
    shadow.style.transform = "scale(" + (1 - hop * 0.14) + ")";
    setCat(x, y);
    if (u >= 1) break;
  }
  sprite.style.transform = ""; shadow.style.transform = ""; moving = false;
}
async function goto(T, target, text) {
  if (text) say(text);
  await followPath(route(target), T);
}

/* ========== 場景物件（有前後層次） ========== */
function mkSprite(w, h, draw, outline) {
  const cv = document.createElement("canvas"); cv.width = w + 2; cv.height = h + 2;
  const c = cv.getContext("2d"); c.translate(1, 1);
  const R = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(x, y, ww, hh); };
  const P = (x, y, col) => R(x, y, 1, 1, col);
  const E = (cx, cy, rx, ry, col) => {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) P(x, y, col);
      }
  };
  draw({ R: R, P: P, E: E });
  if (outline) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    const W = cv.width, H = cv.height, a = c.getImageData(0, 0, W, H).data, out = [];
    const al = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 0 : a[(y * W + x) * 4 + 3];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (!al(x, y) && (al(x - 1, y) || al(x + 1, y) || al(x, y - 1) || al(x, y + 1))) out.push([x, y]);
    c.fillStyle = outline; out.forEach(p => c.fillRect(p[0], p[1], 1, 1));
  }
  return cv;
}
function copyCv(cv) {
  const n = document.createElement("canvas"); n.width = cv.width; n.height = cv.height;
  n.getContext("2d").drawImage(cv, 0, 0); return n;
}
function makeBush(flowers, seed) {
  let s = seed; const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  return mkSprite(26, 17, ({ R, P, E }) => {
    E(13, 15, 11, 1.2, "#3f8f35");
    E(13, 10, 12, 6.5, "#2f7d3f"); E(6.5, 10, 6, 5, "#2f7d3f"); E(19.5, 10, 6, 5, "#2f7d3f");
    E(12, 8.5, 9.5, 5, "#45a04b"); E(7, 9.5, 5, 3.5, "#45a04b"); E(18, 9, 5, 4, "#45a04b");
    E(9, 6.5, 5, 2.6, "#69bf5a"); E(17, 7, 3.4, 2, "#69bf5a");
    for (let i = 0; i < 9; i++) {
      const x = 3 + Math.floor(r() * 20), y = 3 + Math.floor(r() * 10), col = flowers[i % flowers.length];
      P(x, y, col); if (r() < .5) P(x + 1, y, col);
    }
  }, "#256333");
}
function makeLamp() {
  return mkSprite(9, 32, ({ R }) => {
    R(4, 10, 1, 19, "#6b6b78"); R(5, 10, 1, 19, "#52525e");
    R(2, 29, 5, 2, "#52525e"); R(3, 28, 3, 1, "#6b6b78");
    R(1, 3, 7, 7, "#ffe9a0"); R(2, 4, 2, 5, "#fff8cf"); R(6, 3, 2, 7, "#f2c96a");
    R(0, 2, 9, 1, "#6b6b78"); R(1, 1, 7, 1, "#6b6b78"); R(3, 0, 3, 1, "#6b6b78"); R(0, 10, 9, 1, "#6b6b78");
  }, "#3a3a46");
}
function makeGift() {
  return mkSprite(18, 14, ({ R, P }) => {
    const box = (x, y, w, h, base, shade, lid, rib) => {
      R(x, y, w, h, base); R(x + w - 2, y, 2, h, shade); R(x, y + h - 1, w, 1, shade);
      R(x - 1, y, w + 2, 3, lid);
      const cx = x + Math.floor(w / 2) - 1; R(cx, y, 2, h, rib);
      P(cx - 1, y - 1, rib); P(cx + 2, y - 1, rib); P(cx, y - 2, rib); P(cx + 1, y - 2, rib);
    };
    box(1, 6, 9, 7, "#ff6f91", "#d94f74", "#ff8fb0", "#fff6c8");
    box(12, 9, 5, 4, "#6ec9ff", "#3d9be0", "#9adcff", "#ffffff");
    box(3, 2, 5, 4, "#ffd23f", "#e0a92a", "#ffe27a", "#ff6f91");

}
function makeCake() {
  return mkSprite(28, 25, ({ R, P }) => {
    R(1, 21, 26, 2, "#f4f1ff"); R(2, 23, 24, 1, "#c3bde0");
    R(3, 15, 22, 6, "#ffb8d2"); R(21, 15, 4, 6, "#f394b8"); R(3, 20, 22, 1, "#f394b8");
    R(3, 15, 22, 1, "#ffffff");
    [4, 8, 12, 16, 20, 23].forEach((x, i) => R(x, 16, 2, 1 + (i % 2), "#ffffff"));
    for (let i = 0; i < 5; i++) P(6 + 4 * i, 18, "#fff48a");
    R(7, 9, 14, 6, "#fff0d4"); R(18, 9, 3, 6, "#efd3a6");
    R(7, 9, 14, 2, "#8a5a44"); R(9, 11, 2, 2, "#8a5a44"); R(14, 11, 2, 3, "#8a5a44"); R(18, 11, 2, 1, "#8a5a44");
    R(4, 13, 3, 2, "#ff4f6a"); P(5, 12, "#3fa04a"); P(5, 13, "#ffa0b0");
    R(22, 13, 3, 2, "#ff4f6a"); P(23, 12, "#3fa04a"); P(23, 13, "#ffa0b0");
    [10, 14, 18].forEach(x => { R(x, 5, 1, 4, "#ffffff"); P(x, 6, "#ff7ac8"); P(x, 8, "#ff7ac8"); P(x, 4, "#4a3a3a"); });

const props = [];
let cakeProp = null, giftProp = null, cakeGlow = null;
const lampProps = [];
function addProp(cv, xf, f, mult) {
  const el = document.createElement("div"); el.className = "prop"; el.appendChild(cv); stage.appendChild(el);
  const p = { el: el, cv: cv, xf: xf, f: f, mult: mult, w: 0, h: 0 }; props.push(p); return p;
}
function layoutProps() {
  const S = size(), W = innerWidth, H = innerHeight;
  props.forEach(p => {
    const u = S / 30 * kOf(p.f) * p.mult, w = p.cv.width * u, h = p.cv.height * u, st = p.el.style;
    p.w = w; p.h = h;
    st.width = w + "px"; st.height = h + "px";
    st.left = (p.xf * W - w / 2) + "px"; st.top = (p.f * H - h + u) + "px";
    st.zIndex = Math.round(p.f * H);
    if (p.lamp) placeGlow(p, u);
    if (p === cakeProp) placeCakeGlow(p, u);
  });
}
function buildProps() {
  let seed = 4242; const r = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const bushes = [["#ff6f91", "#ffd23f"], ["#ffffff", "#ffd23f"], ["#b784ff", "#ff9a3c", "#ff6f91"]].map((fs, i) => makeBush(fs, 777 + i * 31));
  const lampCv = makeLamp();
  [0.5, 0.57, 0.64, 0.71, 0.78].forEach((f, i) => {
    const xf = pathCx(f) + (i % 2 ? 1 : -1) * (pathHw(f) + 0.03);
    if (!inZone(xf, f)) { const lp = addProp(copyCv(lampCv), xf, f, 0.9); lp.lamp = true; mkGlows(lp); lampProps.push(lp); }
  });
  const placed = []; let tries = 0;
  while (placed.length < 9 && tries < 300) {
    tries++;
    const f = 0.5 + r() * 0.3, xf = 0.04 + r() * 0.92;
    if (Math.abs(xf - pathCx(f)) < pathHw(f) + 0.09) continue;
    if (inZone(xf, f)) continue;
    if (placed.some(q => Math.abs(q[0] - xf) < 0.13 && Math.abs(q[1] - f) < 0.07)) continue;
    placed.push([xf, f]);
  }
  placed.forEach((q, i) => addProp(copyCv(bushes[i % 3]), q[0], q[1], 0.85));
  giftProp = addProp(makeGift(), GIFT.xf, GIFT.f, GIFT.mult);
  cakeProp = addProp(makeCake(), CAKE.xf, CAKE.f, CAKE.mult);
  [10, 14, 18].forEach((x, i) => {
    const fl = document.createElement("div"); fl.className = "flame";
    fl.style.left = ((x + 1.5) / 30 * 100) + "%"; fl.style.top = (5 / 27 * 100) + "%";
    fl.style.animationDelay = (-i * 0.13) + "s";
    cakeProp.el.appendChild(fl);
  });
  cakeGlow = document.createElement("div"); cakeGlow.className = "glow cake"; stage.appendChild(cakeGlow);
  // 讓蛋糕可以被點擊互動
  cakeProp.el.style.pointerEvents = "auto";
  cakeProp.el.style.cursor = "pointer";
  cakeProp.el.addEventListener("pointerdown", e => e.stopPropagation());
  cakeProp.el.addEventListener("click", () => onCake());
  layoutProps();
}
function candlesLit() {
  if (cakeGlow) cakeGlow.style.setProperty("--on", "1");
  cakeProp && cakeProp.el.querySelectorAll(".flame.out").forEach(f => f.classList.remove("out"));
}
function candlesOut() {
  if (!cakeProp) return;
  if (cakeGlow) cakeGlow.style.setProperty("--on", "0");
  cakeProp.el.querySelectorAll(".flame").forEach(f => {
    if (f.classList.contains("out")) return;
    f.classList.add("out");
    const s = document.createElement("div"); s.className = "smoke";
    s.style.left = f.style.left; s.style.top = f.style.top; cakeProp.el.appendChild(s);
    const a = s.animate([
      { transform: "translate(-50%,-50%) scale(.6)", opacity: .9 },
      { transform: "translate(-50%,-420%) scale(1.8)", opacity: 0 }
    ], { duration: 1400, easing: "ease-out" });
    a.onfinish = () => s.remove();
  });
}
function propCenter(p) { return { x: p.xf * innerWidth, y: p.f * innerHeight - p.h * 0.6 }; }
/* 貓咪企喺物件旁邊 (side: -1 左邊, 1 右邊) */
function spotBeside(p, side) {
  const S = size(), f = Math.min(FMAX - 0.02, p.f + 0.012), catW = S * kOf(f);
  const cx = clamp(p.xf * innerWidth + side * (p.w / 2 + catW * 0.38), catW / 2, innerWidth - catW / 2);
  return toTL(cx / innerWidth, f);
}
function faceToward(p) { face(p.xf * innerWidth - (pos.x + size() / 2)); }

/* ========== 像素花園背景 ========== */
function drawGarden() {
  const lh = 170, lw = Math.max(90, Math.round(lh * innerWidth / innerHeight));
  bg.width = lw; bg.height = lh; fx.width = lw; fx.height = lh;
  skyCv.width = lw; skyCv.height = lh; starsCv.width = lw; starsCv.height = lh; tintCv.width = lw; tintCv.height = lh;
  const c = bg.getContext("2d");
  let seed = 20260;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  const P = (x, y, col) => R(x, y, 1, 1, col);
  const disc = (cx, cy, rad, col) => { for (let y = -rad; y <= rad; y++) for (let x = -rad; x <= rad; x++) if (x*x + y*y <= rad*rad + rad*0.6) P(cx + x, cy + y, col); };
  const H0 = Math.round(0.4 * lh);

  // 天空由 #sky 畫布負責（隨時間變色），呢層保持透明
  // 遠山（兩層）
  for (let x = 0; x < lw; x++) {
    const h = 15 + 6 * Math.sin(x / 21 + 1) + 3 * Math.sin(x / 8.3);
    R(x, H0 - h, 1, h + 4, "#bfe4cf"); R(x, H0 - h, 1, 1, "#d3f0df");
  }
  for (let x = 0; x < lw; x++) {
    const h = 8 + 5 * Math.sin(x / 13) + 3 * Math.sin(x / 5.3);
    R(x, H0 - h, 1, h + 4, "#9bd08a"); R(x, H0 - h, 1, 1, "#b4dd9e");
  };
    
  // 樹（有櫻花樹）
  for (let x = -4; x < lw + 8; x += 12 + Math.floor(rnd() * 10)) {
    const rad = 7 + Math.floor(rnd() * 4), cy = H0 - rad - 2 + Math.floor(rnd() * 3), pink = rnd() < 0.38;
    const pal = pink ? ["#e57fa6", "#f7a6c4", "#ffd0e0"] : ["#3f8f4a", "#56ab55", "#7cc968"];
    R(x - 1, cy + rad - 2, 3, rad + 3, "#7a5230"); R(x, cy + rad - 2, 1, rad + 3, "#936640");
    disc(x, cy, rad, pal[0]); disc(x - 1, cy - 1, rad - 2, pal[1]); disc(x - 2, cy - 3, Math.max(2, rad - 5), pal[2]);
    for (let k = 0; k < 5; k++) P(x + Math.floor((rnd() - 0.5) * rad * 1.5), cy + Math.floor((rnd() - 0.3) * rad), pink ? "#ffffff" : "#ff9ab8");
  }
  // 樹籬
  for (let x = 0; x < lw; x++) {
    const top = H0 - 3 - (Math.floor(x / 3) % 2);
    R(x, top, 1, 10, "#2f7d3f");
    if ((x * 7) % 5 < 2) P(x, top + 2 + (x % 3), "#4ea04f");
    P(x, top, "#5bb257");
  }
  // 白色木圍欄
  for (let x = 0; x < lw; x += 4) { R(x, H0 + 1, 3, 7, "#f6ecd2"); R(x + 2, H0 + 1, 1, 7, "#d6c298"); R(x, H0, 3, 1, "#f6ecd2"); }
  R(0, H0 + 3, lw, 1, "#d6c298"); R(0, H0 + 6, lw, 1, "#d6c298"); R(0, H0 + 8, lw, 1, "#4b8f3a");

  // 草地
  const L0 = H0 + 9;
  for (let y = L0; y < lh; y++) {
    const t = (y - L0) / (lh - L0), band = Math.floor(Math.pow(t, 0.75) * 12);

  });

  {
    const S = size(), k = kOf(CAKE.f), unit = innerHeight / lh;

  for (let x = 0; x < lw; x += 2) { const h = 1 + Math.floor(rnd() * 3); R(x, lh - h, 1, h, "#3f8f35"); }

}

/* ========== 時間流逝：破曉 → 清晨 → 中午 → 下午 → 黃昏 → 夜晚 → 破曉 ========== */
const DAY_LEN = 180;   // 一日 24 小時 = 真實 180 秒

  [4,    "#22286e", "#4a3d88", "#9b5f95", "#a79bd2", .9,   .4],

let stars = [], shoots = [], nextShoot = 5;
function buildStars(c) {
  const w = bg.width, h = bg.height, data = c.getImageData(0, 0, w, h).data;
  const free = (x, y) => x >= 0 && y >= 0 && x < w && y < h && data[(y * w + x) * 4 + 3] === 0;
  let seed = 9091; const r = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const lim = Math.round(h * 0.4), cols = ["#ffffff", "#fff3c8", "#cfe0ff", "#ffd9e8"];
  stars = [];
  for (let i = 0; i < 400 && stars.length < Math.round(w * 0.3); i++) {
    const x = Math.floor(r() * w), y = Math.floor(Math.pow(r(), 1.25) * lim), big = r() < 0.14;
    if (!free(x, y) || (big && !(free(x - 1, y) && free(x + 1, y) && free(x, y - 1) && free(x, y + 1)))) continue;

  }

}
function spawnShoot() {
  const w = starsCv.width, h = starsCv.height, gold = Math.random() < 0.2, dir = Math.random() < 0.7 ? -1 : 1;
  const ang = rand(0.38, 0.6), sp = rand(70, 95);

function starsTick(t, dt) {
  const w = starsCv.width, h = starsCv.height;
  sctx.clearRect(0, 0, w, h);
  if (starA < 0.02) { shoots.length = 0; return; }
  stars.forEach(s => {
    const a = starA * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
    sctx.fillStyle = s.col; sctx.globalAlpha = a; sctx.fillRect(s.x, s.y, 1, 1);

  });

  for (let i = shoots.length - 1; i >= 0; i--) {

    if (s.life > s.max) { shoots.splice(i, 1); continue; }
    const fade = Math.min(1, s.life / 0.15, (s.max - s.life) / 0.35);
    for (let j = 0; j < 16; j++) {

  }

}

/* ---------- 夜晚粒子：螢火蟲、瞓覺 Z、日間飛鳥 ---------- */
let fireflies = [], zs = [], birds = [], nextBird = 5, nextZ = 0;
const ZS = [[0,0],[1,0],[2,0],[1,1],[0,2],[1,2],[2,2]], ZB = [[0,0],[1,0],[2,0],[3,0],[3,1],[2,2],[1,3],[0,4],[1,4],[2,4],[3,4]];
function mkFireflies() {
  const lw = fx.width, lh = fx.height; fireflies = [];
  for (let i = 0; i < 16; i++) fireflies.push({ x: rand(4, lw - 4), y: rand(lh * 0.5, lh * 0.92), a: rand(0, 6.28), sp: rand(2, 5), ph: rand(0, 6.28), tw: rand(1.2, 2.6) });
}
function nightFx(t, dt, lw, lh, px) {

    const A = Math.min(1, (NIGHT - 0.3) / 0.4);
    fireflies.forEach(f => {
      f.a += Math.sin(t * 0.7 + f.ph) * 1.4 * dt;
      f.x += Math.cos(f.a) * f.sp * dt; f.y += Math.sin(f.a) * f.sp * dt * 0.7;
      if (f.x < 3 || f.x > lw - 3 || f.y < lh * 0.5 || f.y > lh * 0.94) f.a = Math.atan2(lh * 0.72 - f.y, lw / 2 - f.x) + rand(-0.6, 0.6);
      const g = Math.max(0, Math.sin(t * f.tw + f.ph));
      if (g < 0.05) return;
      const x = Math.round(f.x), y = Math.round(f.y + Math.sin(t * 2 + f.ph) * 0.6);
      fctx.globalAlpha = A * g * 0.28; px(x - 1, y, 3, "#e8ff8a"); px(x, y - 1, 1, "#e8ff8a"); px(x, y + 1, 1, "#e8ff8a");
      fctx.globalAlpha = A * g; px(x, y, 1, "#fbffc4");

  }

    nextZ -= dt;
    if (nextZ <= 0) { nextZ = 1.1; const S = size(), p = pxToLow(pos.x + S / 2 + S * curK * 0.22, pos.y + S - S * curK * 0.82); zs.push({ x: p.x, y: p.y, life: 0, max: 2.6, big: Math.random() < 0.5, ph: rand(0, 6.28) }); }
  }

    const z = zs[i]; z.life += dt;
    if (z.life > z.max) { zs.splice(i, 1); continue; }
    z.y -= 7 * dt; z.x += (4 + Math.sin(t * 2 + z.ph) * 3) * dt;

    }
  }
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; b.x += b.vx * dt; b.y += Math.sin(t * 1.6 + b.ph) * 2 * dt;

  if (n > 0.5) { w.stargaze = 2.4; w.cake = 2; w.wander = .5; w.sassy = .3; w.lucky = .4; w.lookout = .6; }
  if (h >= 10 && h < 16) w.sunbathe = 1.6;
  const names = Object.keys(w).filter(k => w[k] > 0 && !last.includes(k));

    const r = p.s * (1 + .22 * Math.sin(t * 6 + i)) * 7; cX.globalAlpha = fade * Math.min(1, q * 2.5);
    cX.drawImage(GLOW, x - r, y - r, r * 2, r * 2); cX.fillStyle = "#fffbe6"; cX.fillRect(x - 1, y - 1, 2, 2);
    if (q >= 1 && p.s > 1) { cX.fillRect(x - r * .7, y - .5, r * 1.4, 1); cX.fillRect(x - .5, y - r * .7, 1, r * 1.4); } });
  cX.globalAlpha = 1; cX.globalCompositeOperation = "source-over";
}
function celeLoop(now) {
  if (!loopOn) return; requestAnimationFrame(celeLoop);
  const dt = Math.min(.05, (now - lastL) / 1000); lastL = now;
  drawGold(dt); drawCele(now / 1000);
  if (!celebrating && !GP.length) { loopOn = false; cX.clearRect(0, 0, innerWidth, innerHeight); gX.clearRect(0, 0, innerWidth, innerHeight); }
}
function startLoop() { if (loopOn) return; loopOn = true; lastL = performance.now(); requestAnimationFrame(celeLoop); }

async function celebrate() {
  if (celebrating) return; celebrating = true;

  if (!night) { goldBurst(false); heartsAt(c.x, c.y - 20, 8); confettiAt(c.x, c.y - 30, 40); await sleep(2400); celebrating = false; return; }
  buildConst(); dimEl.className = "on";

  await sleep(6500);                                   // 星字停留

  await sleep(1700);

}
