<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>嘰哩 · Zita 生日快樂</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/zpix/dist/zpix.css">
<style>
  :root { --vw: 1200px; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: "zpix", "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", monospace; color: #5c4033; background: #6fbf4f;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
  canvas { image-rendering: pixelated; }
  #bg, #fx { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #bg { z-index: 0; }
  #fx { z-index: 5000; pointer-events: none; }

  /* ---------- 太陽 + 光線 ---------- */
  #sunwrap { position: absolute; left: 3.5vw; top: 2.5vh; width: clamp(62px, 15vw, 104px); aspect-ratio: 1 / 1; z-index: 0;
    pointer-events: none; animation: sunbob 6s ease-in-out infinite; }
  @keyframes sunbob { 50% { transform: translateY(5px); } }
  #sunwrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 520%; height: 520%; border-radius: 50%;
    transform: translate(-50%, -50%); animation: glow 5s ease-in-out infinite;
    background: radial-gradient(circle, rgba(255,244,170,.75) 0, rgba(255,244,170,.26) 36%, rgba(255,244,170,0) 68%); }
  @keyframes glow { 50% { transform: translate(-50%, -50%) scale(1.1); opacity: .8; } }
  #rays { position: absolute; left: 50%; top: 50%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; opacity: .55;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,226,.22) 0 5deg, rgba(255,255,226,0) 5deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, rgba(0,0,0,.5) 18%, transparent 46%);
            mask-image: radial-gradient(circle, #000 0, rgba(0,0,0,.5) 18%, transparent 46%);
    animation: spin 160s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sunwrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #rayA { animation: rayA 1.2s steps(1) infinite; }
  #rayB { animation: rayB 1.2s steps(1) infinite; }
  @keyframes rayA { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes rayB { 0% { opacity: 0; } 50% { opacity: 1; } }

  /* ---------- 雲 ---------- */
  .cloud { position: absolute; left: 0; top: 0; will-change: transform; opacity: .97;
    animation: drift var(--dur, 100s) linear infinite; animation-delay: var(--dl, 0s); }
  .cloud canvas { display: block; width: 100%; height: 100%; }
  @keyframes drift { from { transform: translate3d(-120%, 0, 0); } to { transform: translate3d(calc(var(--vw) + 20%), 0, 0); } }

  /* ---------- Y2K 氣球隊 ---------- */
  #parade { position: absolute; left: 0; top: 1.5vh; width: 520px; height: 260px; z-index: 1;
    transform-origin: 0 0; pointer-events: none; will-change: transform;
    animation: fly 30s linear 3s infinite backwards; }
  @keyframes fly {
    0%   { transform: translateX(var(--from)) scale(var(--ps)); }
    55%  { transform: translateX(var(--to)) scale(var(--ps)); }
    100% { transform: translateX(var(--to)) scale(var(--ps)); }
  }
  #parade .bob { position: absolute; top: 0; left: 0; right: 0; bottom: 0; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-9px); } }
  .bw { position: absolute; transform-origin: 50% 100%; animation: sway 2.6s ease-in-out infinite; animation-delay: var(--d); }
  .bw canvas { display: block; image-rendering: pixelated; }
  @keyframes sway { 0%,100% { transform: rotate(calc(var(--a) - 4deg)); } 50% { transform: rotate(calc(var(--a) + 4deg)); } }
  #banner { position: absolute; left: 50px; top: 211px; width: 420px; box-sizing: border-box;
    padding: 8px 6px 7px; text-align: center; white-space: nowrap;
    font-size: 27px; font-weight: bold; line-height: 1.1;
    background: repeating-linear-gradient(90deg, #fff4fa 0 14px, #ffd3ea 14px 28px);
    border: 4px solid #7a3b8f; box-shadow: 4px 4px 0 #b78ad0, inset 0 0 0 3px #fff;
    clip-path: polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
    transform-origin: 50% 0; animation: flap 2.4s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
  #banner span { display: inline-block; text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(90,40,110,.35);
    animation: hop2 1.1s ease-in-out infinite; animation-delay: var(--t); }
  @keyframes hop2 { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-7px) rotate(-6deg); } }
  .sp { position: absolute; width: 14px; height: 14px; background: #fff; z-index: 1;
    clip-path: polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
    animation: tw 1.2s ease-in-out infinite; animation-delay: var(--t); }
  @keyframes tw { 0%,100% { transform: scale(.2) rotate(0); opacity: .3; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }

  /* ---------- 場景物件 ---------- */
  .prop { position: absolute; pointer-events: none; }
  .prop canvas { display: block; width: 100%; height: 100%; }
  .flame { position: absolute; width: 10%; height: 15%; transform: translate(-50%, -100%); transition: opacity .2s;
    clip-path: polygon(50% 0, 100% 62%, 82% 100%, 18% 100%, 0 62%);
    background: linear-gradient(#fff6b0, #ffb21f 55%, #ff6a1f);
    animation: flick .42s ease-in-out infinite alternate; }
  .flame.out { opacity: 0; }
  @keyframes flick { from { transform: translate(-50%, -100%) scale(1, 1); } to { transform: translate(-50%, -100%) scale(.8, 1.2); } }
  .smoke { position: absolute; width: 7%; height: 7%; border-radius: 50%; background: rgba(238,238,248,.9); pointer-events: none; }

  /* ---------- 貓咪 ---------- */
  #cat { position: absolute; left: 0; top: 0; width: var(--size, 150px); height: var(--size, 150px);
    transform-origin: 50% 100%; will-change: transform; transition: opacity .6s; }
  #shadow { position: absolute; left: 14%; right: 14%; bottom: -3%; height: 11%; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(30,70,20,.45) 0, rgba(30,70,20,.25) 55%, rgba(30,70,20,0) 74%); }
  #sprite { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 100%; }
  #catBody { width: 100%; height: 100%; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.018, .982); } }
  #img { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;
    border: none; background: transparent; -webkit-user-drag: none; cursor: pointer; transition: transform .16s ease-out; }

  /* 對話框（獨立一層，唔會俾前景遮住） */
  #bubble { position: absolute; left: 0; top: 0; z-index: 4000; display: none; pointer-events: none;
    width: max-content; max-width: min(72vw, 280px); will-change: transform; }
  #bi { position: relative; transform-origin: 50% 100%; box-sizing: border-box;
    font-size: 14px; font-weight: bold; line-height: 1.45; text-align: center;
    background: rgba(255,253,245,.97); border: 2px solid #5c4033; box-shadow: 2px 2px 0 #c89666; padding: 4px 12px; }
  #bi::after { content: ""; position: absolute; left: calc(50% + var(--tail, 0px)); bottom: -7px; width: 8px; height: 8px; margin-left: -4px;
    background: rgba(255,253,245,.97); border-right: 2px solid #5c4033; border-bottom: 2px solid #5c4033; transform: rotate(45deg); }

  #hint { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6000;
    font-size: 12px; font-weight: bold; white-space: nowrap; pointer-events: none;
    background: rgba(255,253,245,.9); border: 2px solid #5c4033; box-shadow: 2px 2px 0 #c89666; padding: 3px 12px;
    animation: hintOut 1s ease 8s forwards; }
  @keyframes hintOut { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="sunwrap"><div id="rays"></div></div>
  <div id="clouds"></div>
  <div id="cat">
    <div id="shadow"></div>
    <div id="sprite"><div id="catBody"><img id="img" alt="貓咪"></div></div>
  </div>
  <div id="bubble"><div id="bi"></div></div>
  <canvas id="fx"></canvas>
</div>
<div id="hint">點一點貓咪或畫面 ✨</div>

<script>
if (/debug/.test(location.search)) {
  window.onerror = function (m, u, l) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;background:#fff;color:#c00;font:12px monospace;padding:4px;max-width:100%'; d.textContent = 'Error: ' + m + ' (line ' + l + ')'; document.body.appendChild(d); };
}

/* ========== 設定 ========== */
const BASE = "https://smallsmallpotato.github.io/curiosity/images/cats/";
const IMG = {
  normal: "嘰哩", curious: "嘰哩好奇", happy: "嘰哩開心", angry: "嘰哩生氣",
  sleep: "嘰哩睡覺", lying: "嘰哩躺下", waiting: "嘰哩等待", scorn: "嘰哩鄙視",
  meow: "嘰哩喵喵", wash: "嘰哩洗澡", coax: "嘰哩撒嬌", stand: "嘰哩站起",
  wave: "嘰哩揮手", rich: "嘰哩招財", stretch1: "嘰哩拉筋1", stretch2: "嘰哩拉筋2",
  poop: "嘰哩大便", water: "嘰哩喝水", fear: "嘰哩怕怕", play: "嘰哩玩耍"
};
const src = k => BASE + encodeURIComponent(IMG[k]) + ".PNG";
Object.keys(IMG).forEach(k => { const i = new Image(); i.src = src(k); });   // 預載，換姿勢唔會閃

// 如果發現貓咪行路方向反咗，將呢個改成 false
const FACES_LEFT_BY_DEFAULT = true;
const SPEED = 95;   // 行路速度（近景，像素/秒）

/* 離開畫面再返嚟，會見到佢喺度做以下其中一樣 */
const SPECIALS = [
  { img: "sleep", texts: ["「Zzz... 呼嚕嚕...（反肚大睡）」", "「Zzz...」"] },
  { img: "lying", texts: ["「地板涼涼的，躺平最舒服～」", "「……?」"] },
  { img: "poop", texts: ["「嗯……（埋沙子中）」", "「……請不要偷看。」"] },
  { img: "water", texts: ["「咕嚕咕嚕……喝水水！」", "「咕嚕咕嚕……」"] },
  { img: "fear", texts: ["「嗚哇……剛剛好像有聲音！」", "「怕怕……」"] },
  { img: "play", texts: ["「抓到你了！喵哈哈～」", "「嘿！嘿！」"] }
];

/* ========== 基本元件 ========== */
const stage = document.getElementById("stage");
const bg = document.getElementById("bg"), fx = document.getElementById("fx");
const cat = document.getElementById("cat"), sprite = document.getElementById("sprite");
const catBody = document.getElementById("catBody"), img = document.getElementById("img"), shadow = document.getElementById("shadow");
const bubble = document.getElementById("bubble"), bi = document.getElementById("bi");

let gen = 0, pos = { x: 0, y: 0 }, posF = { xf: 0.5, f: 0.92 }, curK = 1, curKey = "", curText = "";

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const size = () => Math.round(Math.min(150, Math.max(100, innerWidth * 0.3)));
const frame = () => new Promise(r => requestAnimationFrame(r));
function applySize() { cat.style.setProperty("--size", size() + "px"); }

async function wait(ms, tok) {
  await new Promise(r => setTimeout(r, ms));
  if (tok !== gen) throw "cancel";
}

/* ========== 花園座標系 ========== */
// 腳嘅位置用「畫面高度比例 f」表示，f 越大越近
const FMIN = 0.46, FMAX = 0.95, BAND0 = 0.84, BAND1 = 0.96, MIN_SCALE = 0.4;
const pathCx = f => 0.5 + 0.2 * Math.sin((f - 0.4) * 9);
const pathHw = f => 0.04 + 0.1 * Math.max(0, (f - 0.4) / 0.6);
const kOf = f => MIN_SCALE + (1 - MIN_SCALE) * clamp((f - FMIN) / (FMAX - FMIN), 0, 1);
const toTL = (xFrac, f) => ({ x: xFrac * innerWidth - size() / 2, y: f * innerHeight - size() });
const curF = () => (pos.y + size()) / innerHeight;

const CAKE = { xf: 0.78, f: 0.68, mult: 0.8 };
const GIFT = { xf: 0.2, f: 0.72, mult: 1.05 };
const inZone = (xf, f) =>
  (Math.abs(xf - CAKE.xf) < 0.17 && Math.abs(f - CAKE.f) < 0.09) ||
  (Math.abs(xf - GIFT.xf) < 0.14 && Math.abs(f - GIFT.f) < 0.08);

function randPos() {
  const f = rand(0.5, 0.94);
  const xf = f > BAND0 ? rand(0.1, 0.9) : pathCx(f) + rand(-0.6, 0.6) * pathHw(f);
  return Object.assign(toTL(xf, f), { f: f, xf: xf });
}

/* 擺放貓咪：位置 + 遠近縮放 + 前後層次 */
function setCat(x, y) {
  pos.x = x; pos.y = y;
  const S = size(), feet = y + S, k = kOf(feet / innerHeight);
  curK = k; posF.xf = (x + S / 2) / innerWidth; posF.f = feet / innerHeight;
  cat.style.transform = "translate3d(" + x + "px," + y + "px,0) scale(" + k + ")";
  cat.style.zIndex = Math.round(feet);
  layoutBubble();
}

/* ========== 姿勢 / 對話 / 小動作 ========== */
function popBody() {
  catBody.animate([
    { transform: "scale(1,1)" }, { transform: "scale(1.07,.93)", offset: .3 },
    { transform: "scale(.97,1.05)", offset: .65 }, { transform: "scale(1,1)" }
  ], { duration: 300, easing: "ease-out" });
}
function jump() {
  catBody.animate([
    { transform: "translateY(0) scale(1,1)" }, { transform: "translateY(-16%) scale(.95,1.07)", offset: .4 },
    { transform: "translateY(0) scale(1.07,.93)", offset: .75 }, { transform: "translateY(0) scale(1,1)" }
  ], { duration: 480, easing: "ease-out" });
}
function setImg(key) {
  if (curKey === key) return;
  curKey = key; img.src = src(key); popBody();
}
function face(dx) {
  if (Math.abs(dx) < 1) return;
  const goingRight = dx > 0;
  const flip = FACES_LEFT_BY_DEFAULT ? goingRight : !goingRight;
  img.style.transform = flip ? "scaleX(-1)" : "none";
}
function say(t) {
  curText = t || "";
  if (!t) { bubble.style.display = "none"; return; }
  const changed = bi.textContent !== t;
  bi.textContent = t;
  bubble.style.display = "block";
  layoutBubble();
  if (changed) bi.animate([
    { transform: "scale(.6)", opacity: 0 }, { transform: "scale(1.06)", opacity: 1, offset: .6 }, { transform: "scale(1)", opacity: 1 }
  ], { duration: 260, easing: "ease-out" });
}
/* 對話框跟住貓頭，夾喺畫面入面 */
function layoutBubble() {
  if (bubble.style.display === "none") return;
  const S = size(), W = innerWidth;
  const cx = pos.x + S / 2, top = pos.y + S - S * curK;
  const half = bi.offsetWidth / 2;
  const lo = half + 8 - cx, hi = W - half - 8 - cx;
  const shift = Math.min(hi, Math.max(lo, 0));
  const tail = clamp(-shift, -(half - 14), Math.max(0, half - 14));
  bubble.style.transform = "translate3d(" + (cx + shift) + "px," + (top - 2) + "px,0) translate(-50%,-100%)";
  bubble.style.setProperty("--tail", tail + "px");
}
async function pose(T, key, text, ms) {
  setImg(key); say(text);
  await wait(ms || Math.max(1700, 1000 + (text || "").length * 110), T);
}

/* ========== 平滑行路：樣條曲線 + 緩起緩停 + 步伐同步 ========== */
function easeTrap(u) {
  const r = 0.16, v = 1 / (1 - r);
  if (u < r) return v * u * u / (2 * r);
  if (u < 1 - r) return v * (r / 2 + (u - r));
  return 1 - v * (1 - u) * (1 - u) / (2 * r);
}
function route(t) {
  const S = size(), f0 = curF(), f1 = (t.y + S) / innerHeight;
  const n = Math.max(1, Math.ceil(Math.abs(f1 - f0) / 0.12)), pts = [];
  for (let i = 1; i < n; i++) {
    const f = f0 + (f1 - f0) * i / n;
    pts.push(toTL(pathCx(f) + rand(-0.4, 0.4) * pathHw(f), f));
  }
  pts.push({ x: t.x, y: t.y });
  return pts;
}
async function followPath(pts, tok) {
  const S = size(), P = [{ x: pos.x, y: pos.y }].concat(pts), smp = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let s = 0; s < 10; s++) {
      const u = s / 10, u2 = u * u, u3 = u2 * u;
      const cr = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
      smp.push({ x: cr(p0.x, p1.x, p2.x, p3.x), y: cr(p0.y, p1.y, p2.y, p3.y) });
    }
  }
  smp.push({ x: P[P.length - 1].x, y: P[P.length - 1].y });
  const cum = [0];
  for (let i = 1; i < smp.length; i++) {
    const d = Math.hypot(smp[i].x - smp[i - 1].x, smp[i].y - smp[i - 1].y);
    const k = kOf((smp[i].y + S) / innerHeight);
    cum.push(cum[i - 1] + d / (0.45 + 0.55 * k));       // 越遠，行得越「慢」
  }
  const L = cum[cum.length - 1];
  if (L < 4) return;
  setImg("stand");
  const dur = L / SPEED * 1000, t0 = performance.now();
  let idx = 0, phase = 0, lx = pos.x, ly = pos.y;
  for (;;) {
    await frame();
    if (tok !== gen) throw "cancel";
    const u = Math.min(1, (performance.now() - t0) / dur), s = easeTrap(u) * L;
    while (idx < cum.length - 2 && cum[idx + 1] < s) idx++;
    const a = smp[idx], b = smp[idx + 1], seg = cum[idx + 1] - cum[idx];
    const w = seg > 0 ? clamp((s - cum[idx]) / seg, 0, 1) : 0;
    const x = a.x + (b.x - a.x) * w, y = a.y + (b.y - a.y) * w;
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) > 0.25 * Math.hypot(dx, dy)) face(dx);
    const k = kOf((y + S) / innerHeight);
    phase += Math.hypot(x - lx, y - ly) / (S * k) * Math.PI * 2.4;
    lx = x; ly = y;
    const hop = Math.abs(Math.sin(phase));
    sprite.style.transform = "translateY(" + (-hop * S * 0.045) + "px) rotate(" + (Math.sin(phase) * 2.5) + "deg)";
    shadow.style.transform = "scale(" + (1 - hop * 0.14) + ")";
    setCat(x, y);
    if (u >= 1) break;
  }
  sprite.style.transform = ""; shadow.style.transform = "";
}
async function goto(T, target, text) {
  if (text) say(text);
  await followPath(route(target), T);
}

/* ========== 場景物件（有前後層次） ========== */
function mkSprite(w, h, draw, outline) {
  const cv = document.createElement("canvas"); cv.width = w + 2; cv.height = h + 2;
  const c = cv.getContext("2d"); c.translate(1, 1);
  const R = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(x, y, ww, hh); };
  const P = (x, y, col) => R(x, y, 1, 1, col);
  const E = (cx, cy, rx, ry, col) => {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) P(x, y, col);
      }
  };
  draw({ R: R, P: P, E: E });
  if (outline) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    const W = cv.width, H = cv.height, a = c.getImageData(0, 0, W, H).data, out = [];
    const al = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 0 : a[(y * W + x) * 4 + 3];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (!al(x, y) && (al(x - 1, y) || al(x + 1, y) || al(x, y - 1) || al(x, y + 1))) out.push([x, y]);
    c.fillStyle = outline; out.forEach(p => c.fillRect(p[0], p[1], 1, 1));
  }
  return cv;
}
function copyCv(cv) {
  const n = document.createElement("canvas"); n.width = cv.width; n.height = cv.height;
  n.getContext("2d").drawImage(cv, 0, 0); return n;
}
function makeBush(flowers, seed) {
  let s = seed; const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  return mkSprite(26, 17, ({ R, P, E }) => {
    E(13, 15, 11, 1.2, "#3f8f35");
    E(13, 10, 12, 6.5, "#2f7d3f"); E(6.5, 10, 6, 5, "#2f7d3f"); E(19.5, 10, 6, 5, "#2f7d3f");
    E(12, 8.5, 9.5, 5, "#45a04b"); E(7, 9.5, 5, 3.5, "#45a04b"); E(18, 9, 5, 4, "#45a04b");

  }

  const bunting = (y0, sag, gap, off) => {

    for (let x = 0; x < lw; x++) P(x, Math.round(yAt(x)), "#8a6a8a");
    let i = off;
    for (let x = 3; x < lw - 2; x += gap, i++) {
      const y = Math.round(yAt(x)) + 1, col = flagCols[i % flagCols.length];
      for (let r = 0; r < 6; r++) {
        const hw = Math.round(2.4 * (1 - r / 6.5));

  // 樹（有櫻花樹）
  for (let x = -4; x < lw + 8; x += 12 + Math.floor(rnd() * 10)) {
    const rad = 7 + Math.floor(rnd() * 4), cy = H0 - rad - 2 + Math.floor(rnd() * 3), pink = rnd() < 0.38;
    const pal = pink ? ["#e57fa6", "#f7a6c4", "#ffd0e0"] : ["#3f8f4a", "#56ab55", "#7cc968"];
    R(x - 1, cy + rad - 2, 3, rad + 3, "#7a5230"); R(x, cy + rad - 2, 1, rad + 3, "#936640");
    disc(x, cy, rad, pal[0]); disc(x - 1, cy - 1, rad - 2, pal[1]); disc(x - 2, cy - 3, Math.max(2, rad - 5), pal[2]);
    for (let k = 0; k < 5; k++) P(x + Math.floor((rnd() - 0.5) * rad * 1.5), cy + Math.floor((rnd() - 0.3) * rad), pink ? "#ffffff" : "#ff9ab8");
  }

  // 白色木圍欄
  for (let x = 0; x < lw; x += 4) { R(x, H0 + 1, 3, 7, "#f6ecd2"); R(x + 2, H0 + 1, 1, 7, "#d6c298"); R(x, H0, 3, 1, "#f6ecd2"); }
  R(0, H0 + 3, lw, 1, "#d6c298"); R(0, H0 + 6, lw, 1, "#d6c298"); R(0, H0 + 8, lw, 1, "#4b8f3a");

    P(x, y, "#4a9a3c"); if (t > 0.35) { P(x - 1, y - 1, "#4a9a3c"); P(x + 1, y - 1, "#4a9a3c"); }

  }

  fl.sort((a, b) => a.y - b.y);
  fl.forEach(o => {
    const t = (o.y - L0) / (lh - L0), x = Math.round(o.x), y = Math.round(o.y), sz = t > 0.55 ? 2 : 1, col = petals[o.col];

  });

  // 野餐墊（蛋糕放喺上面）
  {

  initFx();
}

  const t = now / 1000, lw = fx.width, lh = fx.height;
  fctx.clearRect(0, 0, lw, lh);
  const px = (x, y, w, col) => { fctx.fillStyle = col; fctx.fillRect(Math.round(x), Math.round(y), w, 1); };

  petalsA.forEach((p, i) => {
    p.y += p.vy * dt; p.x += (3.5 + Math.sin(t * 1.3 + p.ph) * p.sw) * dt;
    if (p.y > lh + 2 || p.x > lw + 3) petalsA[i] = newPetal(false);
    px(p.x, p.y, p.w, p.col);
  });

  butterflies.forEach(b => {
    const cx = lw / 2, cy = lh * 0.7;
    let hd = b.hd + Math.sin(t * 0.9 + b.ph) * 0.9 * dt;
    if (b.x < 6 || b.x > lw - 6 || b.y < lh * 0.46 || b.y > lh * 0.92) {
      const tgt = Math.atan2(cy - b.y, cx - b.x), d = Math.atan2(Math.sin(tgt - hd), Math.cos(tgt - hd));
      hd += d * 2.2 * dt;
    }
    b.hd = hd; b.x += Math.cos(hd) * b.sp * dt; b.y += Math.sin(hd) * b.sp * dt * 0.6;
    const x = Math.round(b.x), y = Math.round(b.y + Math.sin(t * 6 + b.ph) * 0.8), open = Math.sin(t * 14 + b.ph) > 0;
    if (open) {
      [[-2,-1],[-1,-1],[-2,0],[-1,0],[1,-1],[2,-1],[1,0],[2,0]].forEach((o, i) => px(x + o[0], y + o[1], 1, i % 4 === 0 ? b.pal[1] : b.pal[0]));
    } else {
      [[-1,-1],[-1,0],[1,-1],[1,0]].forEach(o => px(x + o[0], y + o[1], 1, b.pal[0]));
    }
    px(x, y - 1, 1, "#3b1f4a"); px(x, y, 1, "#3b1f4a"); px(x, y + 1, 1, "#3b1f4a");
  });

  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.life += dt; h.y -= h.vy * dt; h.x += Math.sin(t * 5 + h.ph) * 4 * dt;
    if (h.life > h.max) { hearts.splice(i, 1); continue; }
    fctx.globalAlpha = Math.min(1, (h.max - h.life) / 0.5);
    HEART.forEach(o => px(h.x + o[0], h.y + o[1], 1, "#ff5c8a"));
    px(h.x + 1, h.y + 1, 1, "#ffc2d6");
    fctx.globalAlpha = 1;
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i]; c.life += dt; c.vy += 60 * dt; c.vx *= 0.985; c.x += c.vx * dt; c.y += c.vy * dt;
    if (c.life > c.max || c.y > lh + 2) { confetti.splice(i, 1); continue; }
    fctx.globalAlpha = Math.min(1, (c.max - c.life) / 0.4);
    px(c.x, c.y, 1, c.col);
    fctx.globalAlpha = 1;
  }
}

/* 行出畫面 */
async function leave(tok) {
  say("「出去逛逛～」");
  const S = size(), p1 = toTL(pathCx(0.9) + rand(-0.1, 0.1), 0.9);
  const tx = pos.x < innerWidth / 2 ? -S - 60 : innerWidth + 60;
  await followPath(route(p1).concat([{ x: tx, y: p1.y }]), tok);
  say("");
}

/* 再返嚟時：已經喺度做特別嘅事 */
async function special(tok) {
  const sp = pick(SPECIALS), p = randPos();
  sprite.style.transform = ""; shadow.style.transform = "";
  cat.style.transition = "none"; cat.style.opacity = "0";
  setCat(p.x, p.y);
  face(Math.random() < 0.5 ? 1 : -1);
  setImg(sp.img); say(sp.texts[0]);
  void cat.offsetWidth;
  cat.style.transition = "opacity .6s"; cat.style.opacity = "1";
  const total = rand(10000, 15000);
  let t = 0, i = 0;
  while (t < total) {
    say(sp.texts[i % sp.texts.length]);
    await wait(2500, tok);
    t += 2500; i++;
  }
}

async function life(tok, startWithSpecial) {
  try {
    if (startWithSpecial) await special(tok);
    const queue = startWithSpecial ? [] : ["greet", "cake"];
    const last = [];
    while (true) {
      const n = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) {
        let name = queue.shift();
        if (!name) {
          const pool = Object.keys(SCENES).filter(k => k !== "greet" && !last.includes(k));
          name = pick(pool);
        }
        last.push(name); if (last.length > 3) last.shift();
        await SCENES[name](tok);
      }
      await leave(tok);
      await wait(rand(3000, 7000), tok);
      await special(tok);
    }
  } catch (e) {
    if (e !== "cancel") console.error(e);
  }
}

function restart(startWithSpecial) {
  gen++;
  sprite.style.transform = ""; shadow.style.transform = "";
  cat.style.transition = "opacity .6s"; cat.style.opacity = "1";
  candlesLit();
  life(gen, startWithSpecial);
}

/* ========== Y2K 氣球隊（掠過天空，隔一段時間再嚟） ========== */
(function parade() {
  const PX = 3, W = 26, BODY = 32;
  const pal = {
    pink:   ["#ff7ac8", "#e04aa6", "#8a2a6e"], blue: ["#6ec9ff", "#3d9be0", "#1f5a9a"],
    lime:   ["#b6f26b", "#7fd043", "#3f7f2a"], lilac: ["#c3a6ff", "#9370e6", "#52368f"],
    silver: ["#f1f5fb", "#b8c4d8", "#5f6b85"], yellow: ["#ffe66b", "#f2b93a", "#9a6a1a"]
  };
  const inPoly = (pts, x, y) => { let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    } return c; };
  const star = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 6.2 : 13.5; star.push([13 + rr * Math.cos(a), 15.5 + rr * Math.sin(a)]); }
  const earL = [[3, 11], [4, 0], [12, 6]], earR = [[23, 11], [22, 0], [14, 6]];
  const shapes = {
    ellipse: (x, y) => Math.pow((x + .5 - 13) / 11, 2) + Math.pow((y + .5 - 15) / 14, 2) <= 1,
    heart: (x, y) => { const u = (x + .5 - 13) / 11.5, v = -(y + .5 - 16) / 11.5; return Math.pow(u*u + v*v - 1, 3) - u*u * Math.pow(v, 3) <= 0; },
    star: (x, y) => inPoly(star, x + .5, y + .5),
    cat: (x, y) => Math.pow((x + .5 - 13) / 11, 2) + Math.pow((y + .5 - 17) / 12.5, 2) <= 1 || inPoly(earL, x + .5, y + .5) || inPoly(earR, x + .5, y + .5)
  };
  function make(o) {
    const [base, shade, dark] = pal[o.col], H = BODY + o.len, cx = 13;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    cv.style.width = W * PX + "px"; cv.style.height = H * PX + "px";
    const c = cv.getContext("2d"), P = (x, y, col) => { c.fillStyle = col; c.fillRect(x, y, 1, 1); };
    const m = (x, y) => x >= 0 && y >= 0 && x < W && y < BODY && shapes[o.shape](x, y);
    let by = 0;
    for (let y = 0; y < BODY; y++) for (let x = 0; x < W; x++) if (m(x, y)) {
      const edge = !m(x - 1, y) || !m(x + 1, y) || !m(x, y - 1) || !m(x, y + 1);
      P(x, y, edge ? dark : ((x - cx) * .5 + (y - 15) * .9 > 4.5 ? shade : base));
      if (x === cx && y > by) by = y;
    }
    [[6,6],[6,7],[6,8],[7,5],[8,4],[9,4],[6,9]].forEach(([x, y]) => { if (m(x, y) && m(x - 1, y) && m(x, y - 1)) P(x, y, "#ffffff"); });
    if (o.shape === "cat") [[5,4],[5,5],[21,4],[21,5]].forEach(([x, y]) => P(x, y, "#ff9ec0"));
    P(cx, by + 1, dark); P(cx - 1, by + 2, dark); P(cx, by + 2, dark); P(cx + 1, by + 2, dark);
    for (let y = by + 3; y < H; y++) P(y < H - 3 ? cx + Math.round(Math.sin(y / 2.6)) : cx, y, "#8a7aa0");
    const fx0 = cx, fy = (o.shape === "star" ? 18 : o.shape === "heart" ? 14 : 16), K = "#3b1f4a", B = "#ff9ec0";
    const dots = (a, col) => a.forEach(([x, y]) => P(fx0 + x, fy + y, col || K));
    const blush = () => dots([[-8,3],[-7,3],[6,3],[7,3]], B);
    const smile = () => dots([[-3,3],[-2,4],[-1,4],[0,4],[1,4],[2,3]]);
    if (o.face === "smile") { dots([[-5,0],[-4,0],[-5,1],[-4,1],[2,0],[3,0],[2,1],[3,1]]); dots([[-5,0],[2,0]], "#fff"); blush(); smile(); }
    if (o.face === "tongue") { dots([[-5,0],[-4,0],[-5,1],[-4,1],[2,0],[3,0],[2,1],[3,1]]); blush(); smile(); dots([[-1,5],[0,5],[-1,6],[0,6]], "#ff4f78"); }
    if (o.face === "jellycat") { dots([[-4,-4],[-3,-4],[-4,-3],[-3,-3],[3,-4],[4,-4],[3,-3],[4,-3]]); dots([[-4,-4],[3,-4]], "#fff"); dots([[-2,0],[1,0],[-1,1],[0,1]]); dots([[-6,-2],[-5,-2],[5,-2],[6,-2]], "#ffb6c1"); }
    if (o.face === "shock") { dots([[-5,-1],[-4,-1],[-5,0],[-4,0],[-5,1],[-4,1],[2,-1],[3,-1],[2,0],[3,0],[2,1],[3,1]]); dots([[-5,-1],[2,-1]], "#fff"); dots([[-1,4],[0,4],[-2,5],[1,5],[-2,6],[1,6],[-1,7],[0,7]]); dots([[-1,5],[0,5],[-1,6],[0,6]], "#7a1f3a"); blush(); }
    if (o.face === "shades") { for (let x = -6; x <= 5; x++) for (let y = -1; y <= 1; y++) if (x !== -1 && x !== 0 || y === -1) P(fx0 + x, fy + y, K); dots([[-5,-1],[2,-1]], "#fff"); dots([[-1,4],[0,4],[1,4],[2,4],[3,3]]); }
    if (o.face === "closed") { dots([[-6,1],[-5,0],[-4,0],[-3,1],[1,1],[2,0],[3,0],[4,1]]); blush(); dots([[-2,3],[-1,4],[0,4],[1,3]]); }
    return cv;
  }
  const defs = [
    { shape: "heart",   col: "pink",   face: "smile",  len: 20, ax: 62,  a: -22, d: "-0.2s" },
    { shape: "ellipse", col: "lime",   face: "tongue", len: 34, ax: 64,  a: 6,   d: "-1.1s" },
    { shape: "star",    col: "lilac",  face: "jellycat", len: 26, ax: 66,  a: 30,  d: "-1.8s" },
    { shape: "cat",     col: "silver", face: "shades",  len: 30, ax: 454, a: -30, d: "-0.7s" },
    { shape: "ellipse", col: "blue",   face: "closed", len: 22, ax: 456, a: -6,  d: "-1.5s" },
    { shape: "ellipse", col: "yellow", face: "shock",  len: 34, ax: 458, a: 22,  d: "-2.1s" }
  ];
  const el = document.createElement("div"); el.id = "parade";
  const bob = document.createElement("div"); bob.className = "bob"; el.appendChild(bob);
  const AY = 214;
  for (const o of defs) {
    const cv = make(o), w = document.createElement("div"); w.className = "bw";
    w.style.left = (o.ax - W * PX / 2) + "px"; w.style.top = (AY - cv.height * PX) + "px";
    w.style.setProperty("--a", o.a + "deg"); w.style.setProperty("--d", o.d);
    w.appendChild(cv); bob.appendChild(w);
  }
  const bn = document.createElement("div"); bn.id = "banner";
  const cols = ["#CBA3B2", "#8F9779", "#B76E79", "#7D8B99", "#CD7F32", "#D8C06A", "#8A8493", "#B87333"];
  [..."Zita 生日快樂～"].forEach((ch, i) => { const sp = document.createElement("span"); sp.textContent = ch; sp.style.color = cols[i % cols.length]; sp.style.setProperty("--t", (i * 0.12) + "s"); bn.appendChild(sp); });
  bob.appendChild(bn);
  [[10,10,"0s"],[300,10,".4s"],[500,60,".8s"],[240,120,".2s"],[40,150,".6s"],[490,170,"1s"]].forEach(([x, y, t]) => {
    const sp = document.createElement("div"); sp.className = "sp"; sp.style.left = x + "px"; sp.style.top = y + "px"; sp.style.setProperty("--t", t); bob.appendChild(sp);
  });
  document.getElementById("stage").appendChild(el);
  function fit() {
    const ps = Math.max(.45, Math.min(1, innerHeight * 0.42 / 262));
    el.style.setProperty("--ps", ps);
    el.style.setProperty("--from", (innerWidth + 40) + "px");
    el.style.setProperty("--to", -(540 * ps + 40) + "px");
  }
  fit(); addEventListener("resize", fit);
})();
