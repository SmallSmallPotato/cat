<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>嘰哩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/zpix/dist/zpix.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: "zpix", monospace; color: #5c4033; background: #6fbf4f; }
  #bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; overflow: hidden; }


  /* Y2K 氣球隊 */
  #parade { position: absolute; left: 0; top: 1.5vh; width: 520px; height: 260px; z-index: 1;
    transform-origin: 0 0; pointer-events: none;
    animation: fly 30s linear 3s infinite backwards; }
  @keyframes fly {
    0%   { transform: translateX(var(--from)) scale(var(--ps)); }
    55%  { transform: translateX(var(--to)) scale(var(--ps)); }
    100% { transform: translateX(var(--to)) scale(var(--ps)); }
  }
  #parade .bob { position: absolute; top: 0; left: 0; right: 0; bottom: 0; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-9px); } }
  .bw { position: absolute; transform-origin: 50% 100%;
    animation: sway 2.6s ease-in-out infinite; animation-delay: var(--d); }
  .bw canvas { display: block; image-rendering: pixelated; }
  @keyframes sway {
    0%,100% { transform: rotate(calc(var(--a) - 4deg)); }
    50%     { transform: rotate(calc(var(--a) + 4deg)); }
  }
  #banner { position: absolute; left: 50px; top: 211px; width: 420px; box-sizing: border-box;
    padding: 8px 6px 7px; text-align: center; white-space: nowrap;
    font-size: 27px; font-weight: bold; line-height: 1.1;
    background: repeating-linear-gradient(90deg, #fff4fa 0 14px, #ffd3ea 14px 28px);
    border: 4px solid #7a3b8f; box-shadow: 4px 4px 0 #b78ad0, inset 0 0 0 3px #fff;
    clip-path: polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
    transform-origin: 50% 0; animation: flap 2.4s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
  #banner span { display: inline-block; text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(90,40,110,.35);
    animation: hop2 1.1s ease-in-out infinite; animation-delay: var(--t); }
  @keyframes hop2 { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-7px) rotate(-6deg); } }
  .sp { position: absolute; width: 14px; height: 14px; background: #fff; z-index: 1;
    clip-path: polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
    animation: tw 1.2s ease-in-out infinite; animation-delay: var(--t); }
  @keyframes tw { 0%,100% { transform: scale(.2) rotate(0); opacity: .3; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }

  /* 貓咪定位層 */
  #cat {
    position: absolute; left: 0; top: 0;
    width: var(--size, 150px); height: var(--size, 150px);
    transform-origin: 50% 100%;
  }
  /* 走路時上下輕跳 */
  #sprite { width: 100%; height: 100%; }
  #sprite.walking { animation: hop .35s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-8px); } }
  #cat img {
    display: block; width: 100%; height: 100%;
    object-fit: contain; image-rendering: pixelated;
    border: none; background: transparent; user-select: none; -webkit-user-drag: none;
  }

  /* 對話框跟住貓咪 */
  #bubble {
    position: absolute; left: 50%; bottom: 100%;
    transform: translateX(-50%);
    white-space: nowrap; display: none;
    font-size: 13px; font-weight: bold;
    background: rgba(255, 253, 245, .95);
    border: 2px solid #5c4033; box-shadow: 2px 2px 0 #c89666;
    padding: 4px 12px; margin-bottom: 2px;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="cat">
    <div id="bubble"></div>
    <div id="sprite"><img id="img" alt="貓咪"></div>
  </div>
</div>

<script>
window.onerror = function (m, u, l) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;background:#fff;color:#c00;font:12px monospace;padding:4px;max-width:100%'; d.textContent = 'Error: ' + m + ' (line ' + l + ')'; document.body.appendChild(d); };
/* ========== 設定 ========== */
const BASE = "https://smallsmallpotato.github.io/curiosity/images/cats/";
const IMG = {
  normal: "嘰哩", curious: "嘰哩好奇", happy: "嘰哩開心", angry: "嘰哩生氣",
  sleep: "嘰哩睡覺", lying: "嘰哩躺下", waiting: "嘰哩等待", scorn: "嘰哩鄙視",
  meow: "嘰哩喵喵", wash: "嘰哩洗澡", coax: "嘰哩撒嬌", stand: "嘰哩站起",
  wave: "嘰哩揮手", rich: "嘰哩招財", stretch1: "嘰哩拉筋1", stretch2: "嘰哩拉筋2",
  poop: "嘰哩大便", water: "嘰哩喝水", fear: "嘰哩怕怕", play: "嘰哩玩耍"
};
const src = k => BASE + encodeURIComponent(IMG[k]) + ".PNG";

// 如果發現貓咪行路方向反咗（面向同行嘅方向相反），將呢個改成 false
const FACES_LEFT_BY_DEFAULT = true;
const SPEED = 90;          // 行路速度（像素/秒）
const STEP_MS = 2500;      // 每個劇本動作停留時間

/* 平時嘅劇本：stand 動作 = 原本短劇；walk = 喺畫面行去另一個位置 */
const SCRIPT = [
  { img: "waiting", text: "「喵？」" },
  { img: "stretch1", text: "「嗯……伸個懶腰」" },
  { img: "stretch2", text: "「> <！」" },
  { img: "waiting", text: "「喵？」" },
  { walk: true, text: "「去邊度好呢～」" },
  { img: "rich", text: "「招財貓上身！」" },
  { img: "waiting", text: "「呼嚕嚕……」" },
  { img: "normal", text: "「嗯……」" },
  { img: "curious", text: "「喵？」" },
  { img: "happy", text: "「呼嚕嚕～舒服！」" },
  { img: "coax", text: "「最喜歡你了～」" },
  { walk: true, text: "「巡視一下地盤～」" },
  { img: "wash", text: "「舔舔毛，整理儀容～」" },
  { img: "happy", text: "「呼嚕嚕～舒服！」" },
  { img: "coax", text: "「最喜歡你了～」" },
  { img: "curious", text: "「呼嚕嚕～」" },
  { img: "normal", text: "「喵～」" },
  { walk: true, text: "「走走走～」" },
  { img: "waiting", text: "「嗯……？」" },
  { img: "stand", text: "「站直瞧瞧外面有什麼。」" },
  { img: "stand", text: "「好像沒有特別的……」" },
  { img: "waiting", text: "「坐回原位繼續發呆。」" },
  { img: "waiting", text: "「嗯……？」" },
  { img: "stand", text: "「……」" },
  { img: "wave", text: "「Hello!」" },
  { img: "stand", text: "「好像沒有特別的……」" },
  { walk: true, text: "「再行多兩步～」" },
  { img: "waiting", text: "「喵～」" },
  { img: "normal", text: "「嗯……」" },
  { img: "scorn", text: "「哼……你在看什麼？」" },
  { img: "meow", text: "「喵喵！快陪我玩啦！」" },
  { img: "angry", text: "「嘶……不理你了！」" },
  { img: "scorn", text: "「哼……」" },
  { img: "wash", text: "「嗯～」" },
  { img: "curious", text: "「呼嚕嚕～」" },
  { img: "normal", text: "「嗯……」" }
];

/* 離開畫面（或者離開頁面一陣）再返嚟，會見到佢喺度做以下其中一樣 */
const SPECIALS = [
  { img: "sleep", texts: ["「Zzz... 呼嚕嚕...（反肚大睡）」", "「Zzz...」"] },
  { img: "lying", texts: ["「地板涼涼的，躺平最舒服～」", "「……?」"] },
  { img: "poop", texts: ["「嗯……（埋沙子中）」", "「……請不要偷看。」"] },
  { img: "water", texts: ["「咕嚕咕嚕……喝水水！」", "「咕嚕咕嚕……」"] },
  { img: "fear", texts: ["「嗚哇……剛剛好像有聲音！」", "「怕怕……」"] },
  { img: "play", texts: ["「抓到你了！喵哈哈～」", "「嘿！嘿！」"] }
];

/* ========== 基本元件 ========== */
const cat = document.getElementById("cat");
const sprite = document.getElementById("sprite");
const img = document.getElementById("img");
const bubble = document.getElementById("bubble");

let gen = 0;               // 每次重啟劇本就加一，用嚟中止舊嘅流程
let pos = { x: 0, y: 0 };

const rand = (a, b) => a + Math.random() * (b - a);
const size = () => Math.round(Math.min(150, Math.max(100, innerWidth * 0.3)));

function applySize() { cat.style.setProperty("--size", size() + "px"); }

async function wait(ms, tok) {
  await new Promise(r => setTimeout(r, ms));
  if (tok !== gen) throw "cancel";
}

function setImg(key) { img.src = src(key); }
function say(t) { bubble.textContent = t || ""; bubble.style.display = t ? "block" : "none"; }

function face(dx) {
  if (Math.abs(dx) < 1) return;
  const goingRight = dx > 0;
  const flip = FACES_LEFT_BY_DEFAULT ? goingRight : !goingRight;
  img.style.transform = flip ? "scaleX(-1)" : "none";
}

/* 花園路線：腳嘅位置用「畫面高度比例 f」表示，f 越大越近 */
const FMIN = 0.46, FMAX = 0.95, BAND0 = 0.84, BAND1 = 0.96;
const pathCx = f => 0.5 + 0.2 * Math.sin((f - 0.4) * 9);
const pathHw = f => 0.04 + 0.1 * Math.max(0, (f - 0.4) / 0.6);

function bounds() {
  const s = size();
  return { minX: 0, maxX: Math.max(0, innerWidth - s), minY: FMIN * innerHeight - s, maxY: FMAX * innerHeight - s };
}
const toTL = (xFrac, f) => ({ x: xFrac * innerWidth - size() / 2, y: f * innerHeight - size() });
const curF = () => (pos.y + size()) / innerHeight;
function randPos() {
  const f = rand(0.5, 0.94);
  const xf = f > BAND0 ? rand(0.1, 0.9) : pathCx(f) + rand(-0.6, 0.6) * pathHw(f);
  return Object.assign(toTL(xf, f), { f: f, xf: xf });
}
/* 沿住花園小徑行去目標 */
async function pathWalk(t, tok) {
  const f0 = curF(), n = Math.max(1, Math.ceil(Math.abs(t.f - f0) / 0.12));
  for (let i = 1; i <= n; i++) {
    const f = f0 + (t.f - f0) * i / n;
    const p = i === n ? toTL(t.xf, t.f) : toTL(pathCx(f) + rand(-0.4, 0.4) * pathHw(f), f);
    await walkTo(p.x, p.y, tok);
  }
}
/* 越近（y 越大）越大，越遠（y 越細）越細 */
const MIN_SCALE = 0.4;
function scaleAt(y) {
  const b = bounds();
  const t = b.maxY > b.minY ? Math.min(1, Math.max(0, (y - b.minY) / (b.maxY - b.minY))) : 1;
  return MIN_SCALE + (1 - MIN_SCALE) * t;
}
function setScale(y) {
  const k = scaleAt(y);
  cat.style.transform = `scale(${k})`;
  bubble.style.transform = `translateX(-50%) scale(${1 / k})`;
  bubble.style.transformOrigin = "50% 100%";
  cat.style.zIndex = Math.round(y);
}
function placeInstant(x, y) {
  cat.style.transition = "none";
  bubble.style.transition = "none";
  setScale(y);
  cat.style.left = x + "px";
  cat.style.top = y + "px";
  pos = { x, y };
  void cat.offsetWidth;
}

/* 慢慢行去 (x,y) */
async function walkTo(x, y, tok) {
  const dx = x - pos.x, dy = y - pos.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 4) return;
  face(dx);
  setImg("stand");
  sprite.classList.add("walking");
  const dur = dist / SPEED;
  cat.style.transition = `left ${dur}s linear, top ${dur}s linear, transform ${dur}s linear`;
  bubble.style.transition = `transform ${dur}s linear`;
  setScale(y);
  cat.style.left = x + "px";
  cat.style.top = y + "px";
  pos = { x, y };
  await wait(dur * 1000, tok);
  sprite.classList.remove("walking");
}

/* ========== 劇本流程 ========== */
async function doStep(st, tok) {
  if (st.walk) {
    say(st.text);
    await pathWalk(randPos(), tok);
  } else {
    setImg(st.img);
    say(st.text);
    await wait(STEP_MS, tok);
  }
}

/* 行出畫面 */
async function leave(tok) {
  say("「出去逛逛～」");
  await pathWalk({ f: 0.9, xf: pathCx(0.9) + rand(-0.1, 0.1) }, tok);
  const s = size();
  const tx = pos.x < innerWidth / 2 ? -s - 40 : innerWidth + 40;
  await walkTo(tx, pos.y, tok);
  say("");
}

/* 再返嚟時：已經喺度做特別嘅事 */
async function special(tok) {
  const sp = SPECIALS[Math.floor(Math.random() * SPECIALS.length)];
  const p = randPos();
  placeInstant(p.x, p.y);
  sprite.classList.remove("walking");
  cat.style.opacity = "0";
  img.style.transform = Math.random() < 0.5 ? "none" : "scaleX(-1)";
  setImg(sp.img);
  say(sp.texts[0]);
  void cat.offsetWidth;
  cat.style.transition = "opacity .6s";
  cat.style.opacity = "1";
  const total = rand(10000, 15000);
  let t = 0, i = 0;
  while (t < total) {
    say(sp.texts[i % sp.texts.length]);
    await wait(STEP_MS, tok);
    t += STEP_MS; i++;
  }
}

async function life(tok, startWithSpecial) {
  try {
    if (startWithSpecial) await special(tok);
    while (true) {
      const laps = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < laps; i++) {
        for (const st of SCRIPT) await doStep(st, tok);
      }
      await leave(tok);
      await wait(rand(3000, 7000), tok);   // 喺畫面外面
      await special(tok);
    }
  } catch (e) {
    if (e !== "cancel") console.error(e);
  }
}

function restart(startWithSpecial) {
  gen++;
  // 凍結喺而家嘅位置
  const cs = getComputedStyle(cat);
  placeInstant(parseFloat(cs.left), parseFloat(cs.top));
  sprite.classList.remove("walking");
  cat.style.opacity = "1";
  life(gen, startWithSpecial);
}


/* ========== 像素花園背景 ========== */
const bg = document.getElementById("bg");
function drawGarden() {
  const lh = 170, lw = Math.max(90, Math.round(lh * innerWidth / innerHeight));
  bg.width = lw; bg.height = lh;
  const c = bg.getContext("2d");
  let seed = 20260;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  const P = (x, y, col) => R(x, y, 1, 1, col);
  const disc = (cx, cy, rad, col) => { for (let y = -rad; y <= rad; y++) for (let x = -rad; x <= rad; x++) if (x*x + y*y <= rad*rad + rad*0.6) P(cx + x, cy + y, col); };
  const H0 = Math.round(0.4 * lh);

  // 天空
  const sky = ["#8fd3f0", "#a5dcf3", "#bde6f5", "#d3eff6", "#e6f6f2"];
  for (let y = 0; y < H0 + 6; y++) {
    const k = Math.min(4, Math.floor(y / (H0 / 5)));
    const edge = y % Math.ceil(H0 / 5) >= Math.ceil(H0 / 5) - 2 && k < 4;
    for (let x = 0; x < lw; x++) P(x, y, edge && (x + y) % 2 ? sky[k + 1] : sky[k]);
  }
  // 雲
  for (let i = 0; i < Math.max(3, lw / 45); i++) {
    const cx = rnd() * lw, cy = 6 + rnd() * 26, w = 14 + rnd() * 14;
    R(cx, cy + 3, w, 3, "#ffffff"); R(cx + 3, cy, w * 0.5, 4, "#ffffff"); R(cx + w * 0.4, cy + 1, w * 0.4, 4, "#ffffff");
    R(cx, cy + 5, w, 1, "#dbeaf5");
  }
  // 遠山
  for (let x = 0; x < lw; x++) {
    const h = 8 + 5 * Math.sin(x / 13) + 3 * Math.sin(x / 5.3);
    R(x, H0 - h, 1, h + 4, "#9bd08a");
    R(x, H0 - h, 1, 1, "#b4dd9e");
  }
  // 樹
  for (let x = -4; x < lw + 8; x += 12 + Math.floor(rnd() * 10)) {
    const rad = 7 + Math.floor(rnd() * 4), cy = H0 - rad - 2 + Math.floor(rnd() * 3);
    R(x - 1, cy + rad - 2, 3, rad + 3, "#7a5230"); R(x, cy + rad - 2, 1, rad + 3, "#936640");
    disc(x, cy, rad, "#3f8f4a"); disc(x - 1, cy - 1, rad - 2, "#56ab55"); disc(x - 2, cy - 3, Math.max(2, rad - 5), "#7cc968");
    if (rnd() < 0.5) for (let k = 0; k < 4; k++) P(x + Math.floor((rnd() - 0.5) * rad * 1.5), cy + Math.floor((rnd() - 0.3) * rad), "#ff9ab8");
  }
  // 樹籬
  for (let x = 0; x < lw; x++) {
    const top = H0 - 3 - (Math.floor(x / 3) % 2);
    R(x, top, 1, 10, "#2f7d3f");
    if ((x * 7) % 5 < 2) P(x, top + 2 + (x % 3), "#4ea04f");
    P(x, top, "#5bb257");
  }
  // 白色木圍欄
  for (let x = 0; x < lw; x += 4) {
    R(x, H0 + 1, 3, 7, "#f6ecd2"); R(x + 2, H0 + 1, 1, 7, "#d6c298"); R(x, H0, 3, 1, "#f6ecd2");
  }
  R(0, H0 + 3, lw, 1, "#d6c298"); R(0, H0 + 6, lw, 1, "#d6c298");
  R(0, H0 + 8, lw, 1, "#4b8f3a");

  // 草地（近大遠細嘅條紋）
  const L0 = H0 + 9;
  for (let y = L0; y < lh; y++) {
    const t = (y - L0) / (lh - L0), band = Math.floor(Math.pow(t, 0.75) * 12);
    const a = t < 0.3 ? "#5fb34a" : "#68bb4e", b = t < 0.3 ? "#58aa45" : "#5fb34a";
    R(0, y, lw, 1, band % 2 ? a : b);
  }
  for (let i = 0; i < lw * 6; i++) {          // 草絲
    const y = L0 + 1 + Math.floor(rnd() * (lh - L0 - 2)), x = Math.floor(rnd() * lw), t = (y - L0) / (lh - L0);
    P(x, y, "#4a9a3c"); if (t > 0.35) { P(x - 1, y - 1, "#4a9a3c"); P(x + 1, y - 1, "#4a9a3c"); }
    if (t > 0.6) P(x, y - 1, "#7ccf5c");
  }

  // 石板小徑
  const onBand = f => f >= BAND0 && f <= BAND1;
  const stone = (x, y, edge) => {
    const row = Math.floor(y / 3), off = (row % 2) * 2;
    if (edge) return "#a98a5c";
    if (y % 3 === 0 || (x + off) % 6 === 0) return "#c9b080";
    return ((x * 31 + y * 17) % 7 === 0) ? "#f3e6c2" : "#e8d6a8";
  };
  for (let y = L0 + 2; y < lh; y++) {
    const f = y / lh;
    let x0, x1;
    if (onBand(f)) { x0 = 0; x1 = lw - 1; }
    else { x0 = Math.round((pathCx(f) - pathHw(f)) * lw); x1 = Math.round((pathCx(f) + pathHw(f)) * lw); }
    for (let x = x0; x <= x1; x++) {
      const edgeY = onBand(f) && (y === Math.round(BAND0 * lh) || y === Math.round(BAND1 * lh));
      P(x, y, stone(x, y, edgeY || (!onBand(f) && (x === x0 || x === x1))));
    }
    if (!onBand(f)) { P(x0 - 1, y, "#4b8f3a"); P(x1 + 1, y, "#4b8f3a"); }
  }
  // 小徑盡頭近圍欄嘅拱門
  const gx = Math.round(pathCx((L0 + 2) / lh) * lw);
  R(gx - 7, H0 - 9, 2, 16, "#8a5a36"); R(gx + 6, H0 - 9, 2, 16, "#8a5a36"); R(gx - 7, H0 - 10, 15, 2, "#a06a40");
  for (let k = 0; k < 9; k++) P(gx - 7 + k * 2 + (k % 2), H0 - 9 + (k % 3), k % 2 ? "#ff7fa6" : "#ffd6e2");

  // 物件（遠到近排序再畫）：花叢、燈、花
  const offPath = (x, y, pad) => { const f = y / lh; return !(f >= BAND0 - 0.02 && f <= BAND1 + 0.02) && Math.abs(x / lw - pathCx(f)) > pathHw(f) + pad; };
  const objs = [];
  for (let i = 0; i < 12; i++) { const y = L0 + 6 + rnd() * (lh * 0.8 - L0), x = rnd() * lw; if (offPath(x, y, 0.07)) objs.push({ t: "bush", x, y }); }
  for (let i = 0; i < 7; i++) { const f = 0.5 + i * 0.065; if (f < BAND0 - 0.04) objs.push({ t: "lamp", x: (pathCx(f) + (i % 2 ? 1 : -1) * (pathHw(f) + 0.025)) * lw, y: f * lh }); }
  for (let i = 0; i < 160; i++) { const y = L0 + 3 + rnd() * (lh - L0 - 4), x = rnd() * lw; if (offPath(x, y, 0.015)) objs.push({ t: "flower", x, y, col: Math.floor(rnd() * 5) }); }
  objs.sort((a, b) => a.y - b.y);
  const petals = ["#ff6f91", "#ffd23f", "#ffffff", "#b784ff", "#ff9a3c"];
  for (const o of objs) {
    const t = (o.y - L0) / (lh - L0), x = Math.round(o.x), y = Math.round(o.y);
    if (o.t === "flower") {
      const sz = t > 0.55 ? 2 : 1, col = petals[o.col];

      if (sz === 1) P(x, y - 2, col);
      else { P(x, y - 4, col); P(x - 1, y - 3, col); P(x + 1, y - 3, col); P(x, y - 2, col); P(x, y - 3, "#ffe38a"); P(x - 1, y - 1, "#3a8a3a"); }
    } else if (o.t === "bush") {
      const rad = 3 + Math.floor(t * 6);
      R(x - rad, y, rad * 2 + 1, 1, "#4a9a3c");
      disc(x, y - rad + 1, rad, "#2f7d3f"); disc(x - 1, y - rad, Math.max(1, rad - 1), "#45a04b"); disc(x - 2, y - rad - 1, Math.max(1, rad - 3), "#69bf5a");
      for (let k = 0; k < rad + 2; k++) P(x + Math.floor((rnd() - 0.5) * rad * 1.8), y - Math.floor(rnd() * rad * 1.6), petals[k % 5]);
    } else {
      const h = 5 + Math.floor(t * 6), w = 1 + Math.floor(t * 2);
      R(x, y - h, w, h, "#6b6b78"); R(x - 1, y - 1, w + 2, 1, "#55555f");
      R(x - 1, y - h - 3, w + 2, 3, "#ffe08a"); R(x - 1, y - h - 4, w + 2, 1, "#6b6b78"); P(x, y - h - 2, "#fff6c8");
    }
  }
  // 前景草邊
  for (let x = 0; x < lw; x += 2) { const h = 1 + Math.floor(rnd() * 3); R(x, lh - h, 1, h, "#3f8f35"); }
}


/* ========== Y2K 氣球隊（掠過天空，隔一段時間再嚟） ========== */
(function parade() {

    silver: ["#f1f5fb", "#b8c4d8", "#5f6b85"], yellow: ["#ffe66b", "#f2b93a", "#9a6a1a"]

  const inPoly = (pts, x, y) => { let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];

  const star = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 6.2 : 13.5; star.push([13 + rr * Math.cos(a), 15.5 + rr * Math.sin(a)]); }
  const earL = [[3, 11], [4, 0], [12, 6]], earR = [[23, 11], [22, 0], [14, 6]];
  const shapes = {
    ellipse: (x, y) => Math.pow((x + .5 - 13) / 11, 2) + Math.pow((y + .5 - 15) / 14, 2) <= 1,
    heart: (x, y) => { const u = (x + .5 - 13) / 11.5, v = -(y + .5 - 16) / 11.5; return Math.pow(u*u + v*v - 1, 3) - u*u * Math.pow(v, 3) <= 0; },
    star: (x, y) => inPoly(star, x + .5, y + .5),
    cat: (x, y) => Math.pow((x + .5 - 13) / 11, 2) + Math.pow((y + .5 - 17) / 12.5, 2) <= 1 || inPoly(earL, x + .5, y + .5) || inPoly(earR, x + .5, y + .5)
  };
  function make(o) {

    cv.style.width = W * PX + "px"; cv.style.height = H * PX + "px";
    const c = cv.getContext("2d"), P = (x, y, col) => { c.fillStyle = col; c.fillRect(x, y, 1, 1); };
    const m = (x, y) => x >= 0 && y >= 0 && x < W && y < BODY && shapes[o.shape](x, y);
    let by = 0;

      const edge = !m(x - 1, y) || !m(x + 1, y) || !m(x, y - 1) || !m(x, y + 1);
      P(x, y, edge ? dark : ((x - cx) * .5 + (y - 15) * .9 > 4.5 ? shade : base));

    [[6,6],[6,7],[6,8],[7,5],[8,4],[9,4],[6,9]].forEach(([x, y]) => { if (m(x, y) && m(x - 1, y) && m(x, y - 1)) P(x, y, "#ffffff"); });
    if (o.shape === "cat") [[5,4],[5,5],[21,4],[21,5]].forEach(([x, y]) => P(x, y, "#ff9ec0"));
    // 結同繩
    P(cx, by + 1, dark); P(cx - 1, by + 2, dark); P(cx, by + 2, dark); P(cx + 1, by + 2, dark);
    for (let y = by + 3; y < H; y++) P(y < H - 3 ? cx + Math.round(Math.sin(y / 2.6)) : cx, y, "#8a7aa0");
    // 表情
    const fx = cx, fy = (o.shape === "star" ? 18 : o.shape === "heart" ? 14 : 16), K = "#3b1f4a", B = "#ff9ec0";
    const dots = (a, col) => a.forEach(([x, y]) => P(fx + x, fy + y, col || K));
    const blush = () => dots([[-8,3],[-7,3],[6,3],[7,3]], B);
    const smile = () => dots([[-3,3],[-2,4],[-1,4],[0,4],[1,4],[2,3]]);
    if (o.face === "smile") { dots([[-5,0],[-4,0],[-5,1],[-4,1],[2,0],[3,0],[2,1],[3,1]]); dots([[-5,0],[2,0]], "#fff"); blush(); smile(); }
    if (o.face === "tongue") { dots([[-5,0],[-4,0],[-5,1],[-4,1],[2,0],[3,0],[2,1],[3,1]]); blush(); smile(); dots([[-1,5],[0,5],[-1,6],[0,6]], "#ff4f78"); }
    if (o.face === "jellycat") { dots([[-4,-4],[-3,-4],[-4,-3],[-3,-3],[3,-4],[4,-4],[3,-3],[4,-3]]); dots([[-4,-4],[3,-4]], "#fff"); dots([[-2,0],[1,0],[-1,1],[0,1]]); dots([[-6,-2],[-5,-2],[5,-2],[6,-2]], "#ffb6c1"); }
    if (o.face === "shock") { dots([[-5,-1],[-4,-1],[-5,0],[-4,0],[-5,1],[-4,1],[2,-1],[3,-1],[2,0],[3,0],[2,1],[3,1]]); dots([[-5,-1],[2,-1]], "#fff"); dots([[-1,4],[0,4],[-2,5],[1,5],[-2,6],[1,6],[-1,7],[0,7]]); dots([[-1,5],[0,5],[-1,6],[0,6]], "#7a1f3a"); blush(); }
    if (o.face === "shades") { for (let x = -6; x <= 5; x++) for (let y = -1; y <= 1; y++) if (x !== -1 && x !== 0 || y === -1) P(fx + x, fy + y, K); dots([[-5,-1],[2,-1]], "#fff"); dots([[-1,4],[0,4],[1,4],[2,4],[3,3]]); }
    if (o.face === "closed") { dots([[-6,1],[-5,0],[-4,0],[-3,1],[1,1],[2,0],[3,0],[4,1]]); blush(); dots([[-2,3],[-1,4],[0,4],[1,3]]); }
    return cv;
  }
  const defs = [  // 左邊一束 + 右邊一束，向內扇形
    { shape: "heart",   col: "pink",   face: "smile",  len: 20, ax: 62,  a: -22, d: "-0.2s" },

    { shape: "star",    col: "lilac",  face: "jellycat", len: 26, ax: 66,  a: 30,  d: "-1.8s" },
    { shape: "cat",     col: "silver", face: "shades",  len: 30, ax: 454, a: -30, d: "-0.7s" },

  const cols = ["#CBA3B2", "#8F9779", "#B76E79", "#7D8B99", "#CD7F32", "#D8C06A", "#8A8493", "#B87333"];
  [..."Zita 生日快樂～"].forEach((ch, i) => { const sp = document.createElement("span"); sp.textContent = ch; sp.style.color = cols[i % cols.length]; sp.style.setProperty("--t", (i * 0.12) + "s"); bn.appendChild(sp); });
  bob.appendChild(bn);
  [[10,10,"0s"],[300,10,".4s"],[500,60,".8s"],[240,120,".2s"],[40,150,".6s"],[490,170,"1s"]].forEach(([x, y, t]) => {
    const sp = document.createElement("div"); sp.className = "sp"; sp.style.left = x + "px"; sp.style.top = y + "px"; sp.style.setProperty("--t", t); bob.appendChild(sp);
  });
  document.getElementById("stage").appendChild(el);
  function fit() {
    const ps = Math.max(.45, Math.min(1, innerHeight * 0.42 / 262));

    el.style.setProperty("--from", (innerWidth + 40) + "px");
    el.style.setProperty("--to", -(540 * ps + 40) + "px");
  }
  fit(); addEventListener("resize", fit);
})();
